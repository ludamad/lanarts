<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanarts Content Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #181c21;
      --panel-2: #20262d;
      --line: #303841;
      --text: #eef1f4;
      --muted: #a9b2bd;
      --accent: #7cc7a2;
      --accent-2: #d9b35f;
      --danger: #e07969;
      --canvas: #030405;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #14171b;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      flex: 0 0 auto;
    }

    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
    }

    .controls {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--canvas);
    }

    .canvas-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }

    #canvas {
      width: min(100%, 1280px);
      height: min(100%, 800px);
      max-height: calc(100vh - 112px);
      background: #000;
      image-rendering: pixelated;
      outline: 1px solid #242a31;
    }

    .idle-panel {
      position: absolute;
      inset: 16px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      pointer-events: none;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 0 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: stretch;
    }

    .preview {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      border: 1px solid #242b33;
      border-radius: var(--radius);
      background: #111418;
      overflow: hidden;
      pointer-events: auto;
      cursor: pointer;
    }

    .preview canvas {
      width: 100%;
      height: 100%;
      min-height: 120px;
      image-rendering: pixelated;
      background: #070909;
    }

    .preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid #242b33;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      background: #151a1f;
    }

    .preview-label strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 680;
    }

    .console {
      height: 54px;
      overflow: auto;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: #0c0e11;
      color: #aeb8c4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: #d5dbe2;
      font-size: 13px;
      font-weight: 650;
    }

    select,
    input,
    textarea {
      width: 100%;
      min-height: 36px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      outline: none;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .encounter-info,
    .build-info {
      display: grid;
      gap: 8px;
      padding: 10px;
      margin: -2px 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .encounter-info[hidden] {
      display: none;
    }

    .encounter-info strong {
      color: var(--text);
      font-size: 13px;
    }

    .encounter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .compact-action {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 11px;
      line-height: 1.2;
    }

    .build-info:empty {
      display: none;
    }

    .run-summary {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .fight-setup {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .presentation-board {
      display: grid;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .presentation-hero {
      display: grid;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .presentation-hero strong {
      color: var(--text);
      font-size: 15px;
      line-height: 1.25;
    }

    .presentation-section {
      display: grid;
      gap: 8px;
    }

    .presentation-section-title {
      color: #d4dde6;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .command-grid {
      display: grid;
      gap: 7px;
    }

    .command-row {
      display: grid;
      gap: 3px;
    }

    .command-row span {
      color: #d4dde6;
      font-size: 11px;
      font-weight: 720;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .command-row code {
      color: var(--accent-2);
      white-space: normal;
      word-break: break-word;
    }

    .board-resource-group {
      display: grid;
      gap: 6px;
    }

    .board-resource-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #d4dde6;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .board-resource-head span:last-child {
      color: var(--muted);
      font-weight: 650;
      letter-spacing: 0;
      text-transform: none;
    }

    .board-card-list {
      display: grid;
      gap: 6px;
    }

    .board-card {
      display: grid;
      gap: 5px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px;
      color: var(--muted);
      background: #151a1f;
      cursor: pointer;
      text-align: left;
    }

    .board-card strong {
      color: var(--text);
      font-size: 12px;
      line-height: 1.25;
    }

    .board-card span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .board-card .item-chips span {
      font-size: 10px;
    }

    .board-card code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      white-space: normal;
      word-break: break-word;
    }

    .threat-grid {
      display: grid;
      gap: 6px;
    }

    .threat-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      padding: 7px;
      border: 1px solid #303841;
      border-radius: 6px;
      background: #11161b;
    }

    .threat-card strong {
      color: var(--text);
      font-size: 12px;
    }

    .threat-card code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .threat-card span {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 11px;
    }

    .micro-card {
      display: grid;
      gap: 5px;
      padding: 7px;
      border: 1px solid #303841;
      border-radius: 6px;
      background: #11161b;
    }

    .micro-card strong {
      color: var(--text);
      font-size: 12px;
      line-height: 1.25;
    }

    .micro-card code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: normal;
      word-break: break-word;
    }

    .micro-card span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .summary-line {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .summary-line strong {
      color: #d4dde6;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-line code {
      color: var(--accent-2);
      white-space: normal;
      word-break: break-word;
    }

    .item-chips,
    .warning-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .item-chips span,
    .warning-list span {
      padding: 3px 6px;
      border-radius: 999px;
      background: #1b2229;
      border: 1px solid #35404a;
      color: #d4dde6;
      font-size: 11px;
    }

    .warning-list span {
      color: #efd7a1;
      border-color: #4d422c;
      background: #241f16;
    }

    .item-chips span.locked {
      color: var(--muted);
      border-color: #303841;
      background: #151a1f;
    }

    .item-chips span.stat {
      color: #ffffff;
      border-color: #486757;
      background: #1c2b25;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag-list span {
      padding: 3px 6px;
      border: 1px solid #35404a;
      border-radius: 999px;
      color: #d4dde6;
      background: #1b2229;
      font-size: 11px;
    }

    .pick-list {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
    }

    .pick-group {
      display: grid;
      gap: 5px;
    }

    .pick-group strong {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pick-buttons button {
      min-height: 28px;
      border: 1px solid #35404a;
      border-radius: 6px;
      padding: 4px 7px;
      color: #d4dde6;
      background: #1b2229;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
    }

    .pick-buttons button.active {
      border-color: #6b8fbd;
      color: #ffffff;
      background: #223247;
    }

    .loadout-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 28px;
    }

    .loadout-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 100%;
      border: 1px solid #35404a;
      border-radius: 6px;
      background: #1b2229;
      color: #d4dde6;
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
    }

    .loadout-chip span {
      padding: 4px 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loadout-chip button {
      align-self: stretch;
      width: 24px;
      border: 0;
      border-left: 1px solid #35404a;
      background: #14191e;
      color: #d4dde6;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    .rhythm-list {
      display: grid;
      gap: 7px;
    }

    .rhythm-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .rhythm-label {
      color: #d4dde6;
      font-size: 11px;
      white-space: nowrap;
    }

    .rhythm-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border: 1px solid #34404a;
      border-radius: 999px;
      background: #0f1317;
    }

    .rhythm-window,
    .rhythm-active,
    .rhythm-clutch,
    .rhythm-perfect,
    .rhythm-hit {
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .rhythm-window {
      background: rgba(217, 179, 95, 0.22);
      z-index: 1;
    }

    .rhythm-active {
      background: rgba(124, 199, 162, 0.44);
      z-index: 2;
    }

    .rhythm-clutch {
      background: rgba(224, 121, 105, 0.58);
      z-index: 2;
    }

    .rhythm-perfect {
      background: rgba(245, 246, 238, 0.78);
      z-index: 3;
    }

    .rhythm-hit {
      width: 2px;
      background: var(--accent-2);
      z-index: 4;
    }

    .rhythm-meta {
      grid-column: 2;
      margin-top: -4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124, 199, 162, 0.18);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--line);
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      color: var(--muted);
      background: var(--panel-2);
      cursor: pointer;
    }

    .segmented button.active {
      color: #08110d;
      background: var(--accent);
      font-weight: 760;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 40px;
      border-radius: 6px;
      border: 1px solid transparent;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 760;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .primary {
      color: #07100c;
      background: var(--accent);
    }

    .secondary {
      color: var(--text);
      background: var(--panel-2);
      border-color: var(--line);
    }

    .resource-list {
      display: grid;
      gap: 8px;
    }

    .resource-group {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .resource {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #151a1f;
      cursor: pointer;
      text-align: left;
    }

    .resource strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
    }

    .resource span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .resource code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    body.running .idle-panel {
      display: none;
    }

    body.running .status-dot {
      background: var(--accent);
    }

    body.running .controls {
      opacity: 0.92;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .controls {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 620px;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Lanarts Content Lab</h1>
      <div class="status" id="status"><span class="status-dot"></span><span>Configure a run</span></div>
    </div>
    <button class="secondary" type="button" id="copyLink">Copy link</button>
  </header>

  <main class="shell">
    <aside class="controls">
      <section class="section">
        <div class="section-title">Character</div>
        <div class="field">
          <label for="className">Class</label>
          <select id="className">
            <option>Fighter</option>
            <option>Necromancer</option>
            <option>Pyrocaster</option>
            <option>Stormcaller</option>
            <option>Templar</option>
            <option>Rogue</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5 late</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8 high</option>
            </select>
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" inputmode="numeric" value="17300">
          </div>
        </div>
        <div class="build-info" id="buildInfo"></div>
      </section>

      <section class="section">
        <div class="section-title">Loadout</div>
        <div class="field">
          <div class="segmented" id="loadoutPreset">
            <button type="button" data-value="none" class="active">None</button>
            <button type="button" data-value="gragh">Gragh</button>
            <button type="button" data-value="late">Late</button>
          </div>
        </div>
        <div class="field">
          <label for="customLoadout">Custom items</label>
          <textarea id="customLoadout" spellcheck="false" placeholder="Health Potion*3, Ring of Vitality"></textarea>
          <div class="loadout-chips" id="activeLoadout"></div>
        </div>
        <div class="field">
          <label for="buildTemplates">Build templates</label>
          <div class="pick-list" id="buildTemplates"></div>
        </div>
        <div class="field">
          <label for="itemChoices">Items</label>
          <div class="pick-list" id="itemChoices"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Map Generation</div>
        <div class="field">
          <label for="mapDesc">Generator</label>
          <select id="mapDesc">
            <option value="">Campaign World</option>
            <option value="map_descs.Overworld">Overworld variety</option>
            <option value="map_descs.GraghsLair">Gragh's Lair</option>
            <option value="map_descs.Hell">Hell</option>
            <option value="map_descs.HiveDepths">Hive Depths</option>
            <option value="map_descs.PixullochiaDepths">Pixullochia Depths</option>
            <option value="map_descs.Crypt">Crypt</option>
            <option value="map_descs.Underdungeon">Underdungeon</option>
          </select>
        </div>
        <div class="field">
          <label for="mapAlgorithm">Algorithm</label>
          <select id="mapAlgorithm">
            <option value="">Default</option>
            <option value="overworld-random">Overworld mix</option>
            <option value="overworld-open-meadow">Open meadow</option>
            <option value="overworld-broken-grove">Broken grove</option>
            <option value="overworld-old-stones">Old stones</option>
            <option value="overworld-river-road">River road</option>
            <option value="overworld-predator-thicket">Predator thicket</option>
            <option value="overworld-ruin-crossroads">Ruin crossroads</option>
          </select>
        </div>
        <div class="field">

          threatProfile: map.threatProfile || map.threat_profile || (map.previewPlan && map.previewPlan.threatProfile) || null,
          runConfig: map.runConfig || null,
        };
      }

      function asList(value) {
        if (Array.isArray(value)) {
          return value;
        }
        if (!value || typeof value !== 'object') {
          return [];
        }
        const numericKeys = Object.keys(value)
          .filter((key) => /^\d+$/.test(key))
          .sort((a, b) => Number(a) - Number(b));
        return numericKeys.map((key) => value[key]);
      }

      function isListFieldKey(key) {
        return [
          'actions',
          'allies',
          'analysis_goals',
          'beatPlan',
          'bot_profiles',
          'buildArchetypes',
          'calls',
          'cards',
          'choices',
          'classes',
          'corridors',
          'demands',
          'encounters',
          'enemy_groups',
          'enemy_packs',
          'enemyPins',
          'features',
          'gaps',
          'item_choices',
          'itemChoices',
          'items',
          'knownSpells',
          'levels',
          'map_algorithms',
          'mapPreviews',
          'maps',
          'micro_drills',
          'microDrills',
          'microPlan',
          'monsters',
          'notes',
          'package_component_sets',
          'previews',
          'props',
          'resourceGroups',
          'resources',
          'rhythmIds',
          'rhythms',
          'risks',
          'rivers',
          'rooms',
          'rows',
          'strengths',
          'tags',
          'telemetry',
          'threats',
          'upcomingSpells',
          'warnings',
          'windows',
        ].includes(key || '');
      }

      function normalizeApiLists(value, key) {
        if (isListFieldKey(key)) {
          return asList(value).map((entry) => normalizeApiLists(entry));
        }
        if (Array.isArray(value)) {
          return value.map((entry) => normalizeApiLists(entry));
        }
        if (!value || typeof value !== 'object') {
          return value;
        }
        return Object.fromEntries(Object.entries(value).map(([childKey, childValue]) => [
          childKey,
          normalizeApiLists(childValue, childKey),
        ]));
      }

      function replaceOptions(select, entries, valueFor, labelFor) {
        const current = select.value;
        select.innerHTML = '';
        asList(entries).forEach((entry) => {
          const option = document.createElement('option');
          option.value = valueFor(entry);
          option.textContent = labelFor(entry);
          select.appendChild(option);
        });
        if ([...select.options].some((option) => option.value === current)) {
          select.value = current;
        }
      }

      function rebuildLoadoutPresets(loadouts, names) {
        const host = $('loadoutPreset');
        host.innerHTML = '';
        (names || Object.keys(loadouts || {})).forEach((name) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.value = name;
          button.textContent = (loadouts[name] && loadouts[name].label) || name;
          button.classList.toggle('active', name === state.preset);
          button.addEventListener('click', () => {
            setPreset(name);
            refreshLab();
          });
          host.appendChild(button);
        });
      }

      function mapAlgorithmsFor(mapDesc) {
        const filtered = mapAlgorithms.filter((entry) => (entry.mapDesc || '') === (mapDesc || ''));
        return filtered.length ? filtered : [{id: '', label: 'Default', mapDesc: mapDesc || '', mapProfile: ''}];
      }

      function mapAlgorithmIdFor(mapDesc, mapProfile) {
        const exact = mapAlgorithms.find((entry) => (entry.mapDesc || '') === (mapDesc || '') && (entry.mapProfile || '') === (mapProfile || ''));
        if (exact) {
          return exact.id || '';
        }
        const fallback = mapAlgorithms.find((entry) => (entry.mapDesc || '') === (mapDesc || '') && !(entry.mapProfile || ''));
        return fallback ? (fallback.id || '') : '';
      }

      function rebuildMapAlgorithms(mapDesc, selected) {
        const select = $('mapAlgorithm');
        const desired = selected !== undefined ? selected : select.value;
        const entries = mapAlgorithmsFor(mapDesc);
        replaceOptions(select, entries, (entry) => entry.id || '', (entry) => entry.label || entry.id || 'Default');
        if ([...select.options].some((option) => option.value === desired)) {
          select.value = desired || '';
        }
      }

      function selectedMapAlgorithm() {
        const id = $('mapAlgorithm').value || '';
        return mapAlgorithms.find((entry) => (entry.id || '') === id) || null;
      }

      function normalizeResource(resource) {
        return {
          name: resource.name,
          group: resource.group || 'Curated',
          meta: resource.meta || resource.goal || '',
          goal: resource.goal || '',
          className: resource.className,
          level: String(resource.level || 1),
          preset: resource.preset || 'none',
          intensity: resource.intensity || 'standard',
          packageComponents: resource.packageComponents || resource.package_components || '',
          customLoadout: resource.customLoadout || resource.loadout || '',
          mapDesc: resource.mapDesc || '',
          mapProfile: resource.mapProfile || '',
          mapAlgorithm: resource.mapAlgorithm || mapAlgorithmIdFor(resource.mapDesc || '', resource.mapProfile || ''),
          encounter: resource.encounter || '',
          monsters: resource.monsters || '',
          enemyGroup: resource.enemyGroup || '',
          enemyPack: resource.enemyPack || '',
          analysisGoal: resource.analysisGoal || resource.goalId || '',
          botProfile: resource.botProfile || 'human',
          drill: resource.drill || (resource.microDrill && resource.microDrill.id) || '',
          packageSummary: resource.packageSummary || null,
          pressurePreview: resource.pressurePreview || null,
          microDrill: resource.microDrill || null,
          scorecard: resource.scorecard || null,
          buildArchetype: resource.buildArchetype || null,
          loadoutReadiness: resource.loadoutReadiness || null,
          previewMode: resource.previewMode || resource.preview_mode || '',
          density: resource.density === undefined ? null : Number(resource.density),
          phase: resource.phase || '',
          tags: resource.tags || [],
          signature: resource.signature || null,
          mapThreat: resource.mapThreat || resource.map_threat || null,
          matchup: resource.matchup || null,
          previewStats: resource.previewStats || resource.preview_stats || null,
          seed: String(resource.seed || 1),
        };
      }

      function applyCatalog(catalog) {
        if (!catalog) {
          return;
        }
        replaceOptions($('className'), catalog.classes || [], (entry) => entry.id, (entry) => entry.label || entry.id);
        replaceOptions($('level'), catalog.levels || [], (entry) => String(entry.value), (entry) => entry.label || String(entry.value));
        replaceOptions($('mapDesc'), catalog.maps || [], (entry) => entry.id || '', (entry) => entry.label || entry.id || 'Campaign World');
        replaceOptions($('encounter'), catalog.encounters || [], (entry) => entry.id || '', (entry) => entry.label || entry.id || 'No forced encounter');
        replaceOptions($('intensity'), catalog.intensities || intensities, (entry) => entry.id || 'standard', (entry) => entry.label || entry.id || 'Standard');
        replaceOptions($('enemyGroup'), catalog.enemy_groups || enemyGroups, (entry) => entry.id || '', (entry) => entry.label || entry.id || 'Enemies');
        replaceOptions($('enemyPack'), [{id: '', label: 'None'}].concat(catalog.enemy_packs || []), (entry) => entry.id || '', (entry) => entry.label || entry.id || 'None');
        replaceOptions($('analysisGoal'), catalog.analysis_goals || analysisGoals, (entry) => entry.id || '', (entry) => entry.label || entry.id || 'Goal');
        replaceOptions($('botProfile'), catalog.bot_profiles || botProfiles, (entry) => entry.id || 'human', (entry) => entry.label || entry.id || 'Human');
        replaceOptions($('packageComponents'), catalog.package_component_sets || packageComponentSets, (entry) => entry.components || entry.id || '', (entry) => entry.label || entry.id || 'Full package');
        replaceOptions($('microDrill'), [{id: '', label: 'None'}].concat(catalog.micro_drills || []), (entry) => entry.id || '', (entry) => entry.label || entry.id || 'None');
        rebuildLoadoutPresets(catalog.loadouts, catalog.loadout_names);
        mapAlgorithms = catalog.map_algorithms || mapAlgorithms;
        encounters = catalog.encounters || encounters;
        intensities = catalog.intensities || intensities;
        enemyGroups = catalog.enemy_groups || enemyGroups;
        enemyPacks = [{id: '', label: 'None', monsters: []}].concat(catalog.enemy_packs || []);
        analysisGoals = catalog.analysis_goals || analysisGoals;
        botProfiles = catalog.bot_profiles || botProfiles;
        packageComponentSets = catalog.package_component_sets || packageComponentSets;
        microDrills = [{id: '', label: 'None'}].concat(catalog.micro_drills || []);
        resources = (catalog.resources || []).map(normalizeResource);
        mapProfiles = (catalog.map_algorithms || catalog.maps || []).slice(0, 4).map(normalizePreviewProfile);
        rebuildMapAlgorithms($('mapDesc').value, $('mapAlgorithm').value);
        wireResources();
        wireMapResources();
        wirePackageResources();
        setConfig(currentConfig());
      }

      function hashString(value) {
        let hash = 2166136261;
        const text = String(value || '');
        for (let i = 0; i < text.length; i += 1) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function rng(seed) {
        let value = seed >>> 0;
        return () => {
          value = Math.imul(value + 0x6D2B79F5, 1);
          let t = value;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function currentConfig() {
        const algorithm = selectedMapAlgorithm();
        return {
          className: $('className').value,
          level: $('level').value,
          seed: $('seed').value.trim() || '1',
          preset: state.preset,
          intensity: $('intensity').value,
          packageComponents: $('packageComponents').value || '',
          customLoadout: $('customLoadout').value.trim(),
          mapDesc: $('mapDesc').value,
          mapProfile: algorithm ? (algorithm.mapProfile || '') : '',
          mapAlgorithm: $('mapAlgorithm').value || '',
          encounter: $('encounter').value,
          drill: $('microDrill').value || '',
          monsters: $('customMonsters').value.trim(),
          enemyGroup: $('enemyGroup').value || '',
          enemyPack: $('enemyPack').value || '',
          goal: $('analysisGoal').value || 'enemy-balance',
          botProfile: $('botProfile').value || 'human',
        };
      }

      function setPreset(value) {
        state.preset = value;
        document.querySelectorAll('#loadoutPreset button').forEach((button) => {
          button.classList.toggle('active', button.dataset.value === value);
        });
      }

      function appendSummaryLine(host, labelText, valueNode) {
        const row = document.createElement('div');
        row.className = 'summary-line';
        const label = document.createElement('strong');
        label.textContent = labelText;
        row.appendChild(label);
        row.appendChild(valueNode);
        host.appendChild(row);
      }

      function pctText(value) {
        return `${Math.round(Number(value || 0) * 100)}%`;
      }

      function pressureChips(preview) {
        const row = document.createElement('div');
        row.className = 'item-chips';
        if (!preview) {
          return row;
        }
        addChip(row, `peak ${preview.peakStack || 0}`);
        addChip(row, `overlap ${pctText(preview.overlapRate)}`);
        addChip(row, `${preview.overlapFrames || 0}/${preview.horizonFrames || 0}f`);
        if (preview.diagnosis && preview.diagnosis.label) {
          addChip(row, preview.diagnosis.label);
        }
        if (preview.firstOverlapFrame !== undefined && preview.firstOverlapFrame !== null) {
          addChip(row, `first ${preview.firstOverlapFrame}f`);
        }
        return row;
      }

      function pressureDiagnosisNotes(preview) {
        const notes = preview && preview.diagnosis && Array.isArray(preview.diagnosis.notes)
          ? preview.diagnosis.notes
          : [];
        const list = document.createElement('div');
        list.className = 'warning-list';
        notes.slice(0, 4).forEach((note) => {
          const chip = document.createElement('span');
          chip.textContent = note;
          list.appendChild(chip);
        });
        return list;
      }

      function renderPressureWindows(preview, limit) {
        const grid = document.createElement('div');
        grid.className = 'threat-grid';
        ((preview && preview.windows) || []).slice(0, limit || 4).forEach((window) => {
          const card = document.createElement('div');
          card.className = 'threat-card';
          const label = document.createElement('strong');
          label.textContent = `Stack ${window.peakStack || 0}`;
          const timing = document.createElement('code');
          timing.textContent = `${window.startFrame || 0}-${window.endFrame || 0}f`;
          const detail = document.createElement('span');
          detail.textContent = `${window.durationFrames || 0}f | ${window.labels || 'package pressure'}`;
          card.appendChild(label);
          card.appendChild(timing);
          card.appendChild(detail);
          grid.appendChild(card);
        });
        return grid;
      }

      function microPlanCard(row) {
        const card = document.createElement('div');
        card.className = 'micro-card';
        const title = document.createElement('strong');
        title.textContent = `${row.label || row.id || 'Threat'} - ${row.posture || row.read || 'micro'}`;
        const timing = document.createElement('code');
        const window = row.effectiveWindowFrames !== undefined
          ? `${row.effectiveWindowFrames}f effective`
          : `${row.windowFrames || 0}f window`;
        timing.textContent = `${row.firstFrame || 0}f first / ${row.loopFrames || 0}f loop / ${window}`;
        const action = document.createElement('span');
        action.textContent = row.action || row.read || '';
        card.appendChild(title);
        card.appendChild(timing);
        if (action.textContent) {
          card.appendChild(action);
        }
        const telemetry = (row.telemetry || []).slice(0, 3);
        const chips = chipRow([
          row.target,
          row.read,
          row.reactionTaxFrames ? `${row.reactionTaxFrames}f reaction tax` : '',
          row.perfectWindowFrames ? `${row.perfectWindowFrames}f perfect` : '',
          row.dropRiskPct ? `${row.dropRiskPct}% drop risk` : '',
          ...telemetry,
        ]);
        if (chips.childElementCount) {
          card.appendChild(chips);
        }
        if (row.failure) {
          const failure = document.createElement('span');
          failure.textContent = row.failure;
          card.appendChild(failure);
        }
        return card;
      }

      function renderMicroPlanGrid(rows, limit) {
        const grid = document.createElement('div');
        grid.className = 'threat-grid';
        const list = rows || [];
        list.slice(0, limit || list.length).forEach((row) => {
          grid.appendChild(microPlanCard(row));
        });
        return grid;
      }

      function commandText(command) {
        return (command || []).map((arg) => {
          const text = String(arg === undefined || arg === null ? '' : arg);
          if (!text) {
            return "''";
          }
          if (/^[A-Za-z0-9_./:=@%+-]+$/.test(text)) {
            return text;
          }
          return "'" + text.replace(/'/g, "'\\''") + "'";
        }).join(' ');
      }

      function renderLoadoutReadiness(readiness) {
        const box = document.createElement('div');
        box.className = 'item-chips';
        if (!readiness) {
          return box;
        }
        addChip(box, `${readiness.label || 'readiness'} ${readiness.score || 0}`, 'stat');
        asList(readiness.demands).slice(0, 4).forEach((demand) => {
          addChip(box, demand.label || demand.id);
        });
        asList(readiness.strengths).slice(0, 3).forEach((text) => {
          addChip(box, text);
        });
        asList(readiness.gaps).slice(0, 3).forEach((text) => {
          addChip(box, text, 'locked');
        });
        asList(readiness.notes).slice(0, 2).forEach((text) => {
          addChip(box, text);
        });
        return box;
      }

      function renderMatchupRead(matchup) {
        const box = document.createElement('div');
        box.className = 'item-chips';
        if (!matchup) {
          return box;
        }
        addChip(box, matchup.label || 'matchup', matchup.severity === 'high' ? 'locked' : 'stat');
        asList(matchup.risks).slice(0, 3).forEach((text) => addChip(box, text, 'locked'));
        asList(matchup.strengths).slice(0, 3).forEach((text) => addChip(box, text));
        asList(matchup.notes).slice(0, 2).forEach((text) => addChip(box, text));
        asList(matchup.telemetry).slice(0, 3).forEach((key) => addChip(box, key));
        return box;
      }

      function renderScorecard(scorecard, limit = 5) {
        const box = document.createElement('div');
        box.className = 'item-chips';
        if (!scorecard) {
          return box;
        }
        addChip(box, scorecard.label || 'scorecard', 'stat');
        const rows = asList(scorecard.rows);
        rows.slice(0, limit).forEach((row) => {
          const target = row.target ? ` ${row.target}` : '';
          const text = `${row.label || row.metric || 'metric'}${target}`;
          addChip(box, text, row.comparator === '<=' ? 'locked' : undefined);
        });
        if (rows.length > limit) {
          addChip(box, `+${rows.length - limit}`);
        }
        return box;
      }

      function renderRunSummary(summary) {
        const host = $('runSummary');
        host.innerHTML = '';
        if (!summary) {
          const pending = document.createElement('div');
          pending.className = 'muted';
          pending.textContent = state.runtimeReady ? 'No run selected' : 'Runtime data pending';
          host.appendChild(pending);
          return;
        }

        const target = document.createElement('div');
        const targetLabel = summary.encounter && summary.encounter.id
          ? summary.encounter.label || summary.encounter.id
          : (summary.map && (summary.map.label || summary.map.id)) || 'Campaign World';
        target.textContent = `${summary.config.className} L${summary.config.level}, ${targetLabel}`;
        appendSummaryLine(host, 'Target', target);

        const loadout = document.createElement('div');
        loadout.className = 'item-chips';
        const items = (summary.loadout && summary.loadout.items) || [];
        if (items.length === 0) {
          const empty = document.createElement('span');
          empty.textContent = summary.loadout ? summary.loadout.label : 'No preset';
          loadout.appendChild(empty);
        } else {
          items.slice(0, 8).forEach((item) => {

            chip.textContent = item.amount > 1 ? `${item.item} x${item.amount}` : item.item;
            loadout.appendChild(chip);

          if (items.length > 8) {
            const more = document.createElement('span');
            more.textContent = `+${items.length - 8}`;
            loadout.appendChild(more);

        if (summary.packageSummary && summary.packageSummary.rhythmCount) {

          packageInfo.className = 'item-chips';

          addChip(packageInfo, `first ${summary.packageSummary.firstThreatFrame || 0}f`);
          addChip(packageInfo, `fastest ${summary.packageSummary.fastestLoopFrames || 0}f`);

              addChip(packageInfo, `${summary.packageSummary.rescuePullFrames}f pull`);

          addChip(control, model.positioning || model.classRange || 'positioning');
          addChip(control, `${model.targetDistance || 0}px target`);
          addChip(control, `${model.decisionInterval || 1}f decisions`);
          appendSummaryLine(host, 'Control', control);

      function renderFightSetup(setup) {

        const goal = document.createElement('div');
        goal.className = 'item-chips';

        if (objective.primary) {

        }
        (objective.allies || []).forEach((ally) => {

        if (setup.pressurePreview && (setup.pressurePreview.peakStack || setup.pressurePreview.overlapFrames)) {
          appendSummaryLine(host, 'Density', pressureChips(setup.pressurePreview));
          const diagnosis = pressureDiagnosisNotes(setup.pressurePreview);
          if (diagnosis.childElementCount) {
            appendSummaryLine(host, 'Pressure', diagnosis);
          }
          if ((setup.pressurePreview.windows || []).length) {
            appendSummaryLine(host, 'Stacks', renderPressureWindows(setup.pressurePreview, 5));
          }

        const microPlan = setup.microPlan || [];
        if (microPlan.length) {
          appendSummaryLine(host, 'Micro', renderMicroPlanGrid(microPlan, 6));

        const threats = setup.threats || [];
        if (threats.length) {
          const grid = document.createElement('div');
          grid.className = 'threat-grid';
          threats.forEach((threat) => {
            const card = document.createElement('div');
            card.className = 'threat-card';
            const label = document.createElement('strong');
            label.textContent = threat.label || threat.id || 'Threat';
            const timing = document.createElement('code');
            timing.textContent = `${threat.firstFrame || 0}f / ${threat.loopFrames || 0}f`;
            const detail = document.createElement('span');
            const parts = [threat.read || '', threat.target || ''];
            if (threat.activeFrames) {
              parts.push(`${threat.activeFrames}f active`);
            }
            if (threat.clutchFrames) {
              parts.push(`${threat.clutchFrames}f clutch`);
            }
            if (threat.perfectFrames) {
              parts.push(`${threat.perfectFrames}f perfect`);

      function commandPreviewText(command) {

          return '';

        if (command.text) {
          return command.text;
        }
        if (Array.isArray(command.args)) {
          return commandText(command.args);
        }
        if (Array.isArray(command)) {
          return commandText(command);
        }
        return '';

      function customLoadoutParts() {
        return $('customLoadout').value.split(',').map((part) => part.trim()).filter(Boolean);
      }

      function setCustomLoadoutParts(parts) {
        $('customLoadout').value = parts.map((part) => String(part || '').trim()).filter(Boolean).join(', ');
      }

      function renderCustomLoadout() {
        const host = $('activeLoadout');
        host.innerHTML = '';
        customLoadoutParts().forEach((part, index) => {
          const chip = document.createElement('div');
          chip.className = 'loadout-chip';
          const label = document.createElement('span');
          label.textContent = part;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'x';
          remove.title = `Remove ${part}`;
          remove.addEventListener('click', () => {
            const next = customLoadoutParts();
            next.splice(index, 1);
            setCustomLoadoutParts(next);
            refreshLab();
          });
          chip.appendChild(label);
          chip.appendChild(remove);
          host.appendChild(chip);
        });
      }

      function addItemSpec(spec) {
        const next = String(spec || '').trim();
        if (!next) {
          return;
        }
        const parts = customLoadoutParts();
        if (!parts.includes(next)) {
          parts.push(next);
          setCustomLoadoutParts(parts);
        }
        refreshLab();
      }

      function removeItemSpec(spec) {
        const target = String(spec || '').trim();
        if (!target) {
          return;
        }
        setCustomLoadoutParts(customLoadoutParts().filter((part) => part !== target));
        refreshLab();
      }

      function toggleItemSpec(spec) {
        const target = String(spec || '').trim();
        if (!target) {
          return;
        }
        if (customLoadoutParts().includes(target)) {
          removeItemSpec(target);
        } else {
          addItemSpec(target);
        }
      }

      function updateGeneratedResources() {
        const response = callContentApi('lanarts_content_resource_matrix_json', currentConfig());
        generatedResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wireResources();
      }

      function updateMapResources() {
        const response = callContentApi('lanarts_content_map_matrix_json', currentConfig());
        mapResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wireMapResources();
      }

      function updatePackageResources() {
        const response = callContentApi('lanarts_content_package_matrix_json', currentConfig());
        packageResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wirePackageResources();
      }

      function updateWorkspace() {
        workspace = callContentApi('lanarts_content_workspace_json', currentConfig());
        if (!workspace) {
          return false;
        }
        loadoutOptions = workspace.loadoutOptions || null;
        resolvedRun = workspace.runSummary || null;
        fightSetup = workspace.fightSetup || null;
        actionGuide = workspace.actionGuide || (fightSetup && fightSetup.actionGuide) || null;
        enemyOptions = workspace.enemyOptions || null;
        analysisPlan = workspace.analysisPlan || null;
        presentation = callContentApi('lanarts_content_presentation_json', currentConfig());
        mapResources = workspace.mapMatrix && workspace.mapMatrix.resources
          ? workspace.mapMatrix.resources.map(normalizeResource)
          : [];
        packageResources = workspace.packageMatrix && workspace.packageMatrix.resources
          ? workspace.packageMatrix.resources.map(normalizeResource)
          : [];
        generatedResources = workspace.resourceMatrix && workspace.resourceMatrix.resources
          ? workspace.resourceMatrix.resources.map(normalizeResource)
          : [];
        microDrills = workspace.microDrills && workspace.microDrills.drills
          ? [{id: '', label: 'None'}].concat(workspace.microDrills.drills)
          : microDrills;
        renderBuildOptions(loadoutOptions);
        renderRunSummary(resolvedRun);
        renderFightSetup(fightSetup);
        renderActionGuide(actionGuide);
        renderEnemyOptions(enemyOptions);
        renderAnalysisPlan(analysisPlan);
        renderPresentationBoard(presentation);
        drawPreviews(workspace.mapGeneration);
        wireMapResources();
        wirePackageResources();
        wireResources();
        return true;
      }

      function refreshLab() {
        renderCustomLoadout();
        if (updateWorkspace()) {
          return;
        }
        updateLoadoutOptions();
        updateRunSummary();
        updateFightSetup();
        updateActionGuide();
        updateEnemyOptions();
        updateAnalysisPlan();
        updatePresentation();
        drawPreviews();
        updateMapResources();
        updatePackageResources();
        updateGeneratedResources();
      }

      function setConfig(config) {
        $('className').value = config.className || 'Fighter';
        $('level').value = String(config.level || '1');
        $('seed').value = String(config.seed || '1');
        $('customLoadout').value = config.customLoadout || '';
        $('mapDesc').value = config.mapDesc || '';
        rebuildMapAlgorithms($('mapDesc').value, config.mapAlgorithm || mapAlgorithmIdFor(config.mapDesc || '', config.mapProfile || ''));
        $('mapAlgorithm').value = config.mapAlgorithm || mapAlgorithmIdFor(config.mapDesc || '', config.mapProfile || '');
        $('encounter').value = config.encounter || '';
        $('microDrill').value = config.drill || config.microDrill || '';
        $('intensity').value = config.intensity || 'standard';
        $('packageComponents').value = config.packageComponents || '';
        $('customMonsters').value = config.monsters || '';
        $('enemyGroup').value = config.enemyGroup || $('enemyGroup').value || 'overworld-ambient';
        $('enemyPack').value = config.enemyPack || '';
        const goalId = config.analysisGoal || config.goalId || (analysisGoals.some((entry) => entry.id === config.goal) ? config.goal : '');
        $('analysisGoal').value = goalId || 'enemy-balance';
        $('botProfile').value = config.botProfile || 'human';
        setPreset(config.preset || 'none');
        refreshLab();
      }

      function applyMicroDrillSelection() {
        const id = $('microDrill').value || '';
        if (!id) {
          refreshLab();
          return;
        }
        let drill = (microDrills || []).find((entry) => (entry.id || '') === id);
        if (!drill || !drill.config) {
          const response = callContentApi('lanarts_content_micro_drills_json', currentConfig());
          drill = response && response.drills
            ? response.drills.find((entry) => (entry.id || '') === id)
            : null;
        }
        if (drill && drill.config) {
          setConfig(drill.config);
        } else {
          refreshLab();
        }
      }

      function selectedEncounter() {
        const id = $('encounter').value;
        return encounters.find((entry) => (entry.id || '') === id) || null;
      }

      function selectedIntensity() {
        const id = $('intensity').value || 'standard';
        return intensities.find((entry) => (entry.id || '') === id) || intensities.find((entry) => entry.id === 'standard') || {tempo: 1, damage: 1, summons: 1};
      }

      function scaledFrames(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        const frames = Number(raw === undefined || raw === null ? 1 : raw);
        const tempo = Math.max(0.25, Number(intensity.tempo || 1));
        return Math.max(0, Math.round(frames / tempo));
      }

      function scaledDamage(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.damage || 1));
      }

      function scaledCount(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Math.max(1, Math.ceil(Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.summons || 1))));
      }

      function componentSet(value) {
        const parts = String(value || '').split(',').map((part) => part.trim()).filter(Boolean);
        if (!parts.length) {
          return null;
        }
        const set = new Set(parts);
        if (set.has('rescue')) {
          set.add('escort');
        }
        return set;
      }

      function packageForComponents(pkg, components) {
        const selected = componentSet(components);
        if (!selected) {
          return pkg || {};
        }
        const result = {primary: pkg.primary};
        ['escort', 'orbit', 'pulse', 'sweep', 'summon', 'rescue'].forEach((key) => {
          if (selected.has(key) && pkg[key]) {
            result[key] = pkg[key];
          }
        });
        return result;
      }

      function encounterRhythms(encounter) {
        const pkg = packageForComponents((encounter && encounter.package) || {}, $('packageComponents').value || '');
        const intensity = selectedIntensity();
        const rows = [];
        if (pkg.orbit) {
          const duration = scaledFrames(pkg.orbit.duration, 1, intensity);
          rows.push({
            id: 'orbit',
            label: 'Orbs',
            offset: scaledFrames(pkg.orbit.offset, 0, intensity),
            interval: scaledFrames(pkg.orbit.interval, 1, intensity),
            duration,
            meta: `${pkg.orbit.count || 4} orbiting hitboxes, ${duration}f, damage ${scaledDamage(pkg.orbit.damage, 3, intensity).toFixed(1)}${pkg.orbit.affects_escorts ? ', hits ally' : ''}`,
          });
        }
        if (pkg.pulse) {
          const windup = scaledFrames(pkg.pulse.windup, 0, intensity);
          const active = scaledFrames(pkg.pulse.active, 1, intensity);
          rows.push({
            id: 'pulse',
            label: 'AOE',
            offset: scaledFrames(pkg.pulse.offset, 0, intensity),
            interval: scaledFrames(pkg.pulse.interval, 1, intensity),
            duration: windup + active,
            activeStart: windup,
            active,
            meta: `player-targeted${pkg.pulse.affects_escorts ? ' plus ally' : ''}, ${windup}f warning, ${active}f active, damage ${scaledDamage(pkg.pulse.damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.sweep) {
          const windup = scaledFrames(pkg.sweep.windup, 48, intensity);
          const active = scaledFrames(pkg.sweep.active, 34, intensity);
          rows.push({
            id: 'sweep',
            label: 'Sweep',
            offset: scaledFrames(pkg.sweep.offset, 52, intensity),
            interval: scaledFrames(pkg.sweep.interval, 180, intensity),
            duration: windup + active,
            activeStart: windup,
            active,
            meta: `crossing lane${pkg.sweep.affects_escorts ? ' plus ally' : ''}, ${windup}f warning, ${active}f active, damage ${scaledDamage(pkg.sweep.damage, 3, intensity).toFixed(1)}`,
          });
        }
        if (pkg.escort) {
          rows.push({
            id: 'escort',
            label: 'Ally',
            offset: 0,
            interval: 600,
            duration: 600,
            meta: `protect ${pkg.escort.monster || 'ally'}, ${pkg.escort.hp || '?'} hp`,
          });
        }
        if (pkg.rescue) {
          const windup = scaledFrames(pkg.rescue.windup, 68, intensity);
          const lateWindow = scaledFrames(pkg.rescue.late_window, 22, intensity);
          const perfectWindow = scaledFrames(pkg.rescue.perfect_window, 6, intensity);
          const pullFrames = scaledFrames(pkg.rescue.pull_frames, 90, intensity);
          rows.push({
            id: 'rescue',
            label: 'Rescue',
            offset: scaledFrames(pkg.rescue.offset, 54, intensity),
            interval: scaledFrames(pkg.rescue.interval, 205, intensity),
            duration: windup,
            activeStart: Math.max(0, windup - lateWindow),
            clutchWindow: lateWindow,
            perfectWindow,
            pullFrames,
            meta: `body-block line, ${lateWindow}f clutch window, ${perfectWindow}f perfect, ${pullFrames}f pull, ally damage ${scaledDamage(pkg.rescue.ally_damage, 10, intensity).toFixed(1)}, block damage ${scaledDamage(pkg.rescue.block_damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.summon) {
          const windup = scaledFrames(pkg.summon.windup, 24, intensity);
          rows.push({
            id: 'summon',
            label: 'Summons',
            offset: scaledFrames(pkg.summon.offset, 0, intensity),
            interval: scaledFrames(pkg.summon.interval, 1, intensity),
            duration: windup,
            windup,
            meta: `${windup}f portal, ${scaledCount(pkg.summon.count, 1, intensity)} ${((pkg.summon.monsters || [])[0]) || 'add'} per wave, cap ${scaledCount(pkg.summon.max_alive, 4, intensity)}`,
          });
        }
        return rows;
      }

      function rhythmMeta(row) {
        if (row.meta) {
          return row.meta;
        }
        if (row.id === 'orbit') {
          return `${row.count || 1} orbiting hitboxes, ${row.duration || 0}f, damage ${Number(row.damage || 0).toFixed(1)}${row.affectsEscorts ? ', hits ally' : ''}`;
        }
        if (row.id === 'pulse') {
          return `player-targeted${row.affectsEscorts ? ' plus ally' : ''}, ${row.windup || 0}f warning, ${row.active || 0}f active, damage ${Number(row.damage || 0).toFixed(1)}`;
        }
        if (row.id === 'sweep') {
          return `crossing lane${row.affectsEscorts ? ' plus ally' : ''}, ${row.windup || 0}f warning, ${row.active || 0}f active, damage ${Number(row.damage || 0).toFixed(1)}`;
        }
        if (row.id === 'escort') {
          return `protect ${row.monster || 'ally'}, ${row.hp || '?'} hp`;
        }
        if (row.id === 'rescue') {
          const pull = row.pullFrames ? `, ${row.pullFrames}f pull` : '';
          const perfect = row.perfectWindow ? `, ${row.perfectWindow}f perfect` : '';
          return `body-block line, ${row.clutchWindow || row.lateWindow || 0}f clutch window${perfect}${pull}, ally damage ${Number(row.allyDamage || 0).toFixed(1)}, block damage ${Number(row.blockDamage || 0).toFixed(1)}`;
        }
        if (row.id === 'summon') {
          const monster = ((row.monsters || [])[0]) || 'add';
          const windup = row.windup ? `${row.windup}f portal, ` : '';
          return `${windup}${row.count || 1} ${monster} per wave, cap ${row.maxAlive || 1}`;
        }
        return '';
      }

      function renderRhythmTrack(row) {
        const item = document.createElement('div');
        item.className = 'rhythm-row';
        const label = document.createElement('div');
        label.className = 'rhythm-label';
        label.textContent = row.label;
        const track = document.createElement('div');
        track.className = 'rhythm-track';
        const interval = Math.max(1, row.interval);
        const offsetPct = Math.max(0, Math.min(100, (row.offset % interval) / interval * 100));
        const durationPct = Math.max(2, Math.min(100 - offsetPct, row.duration / interval * 100));
        const windowNode = document.createElement('span');
        windowNode.className = 'rhythm-window';
        windowNode.style.left = `${offsetPct}%`;
        windowNode.style.width = `${durationPct}%`;
        let activeNode = null;
        if (row.activeStart !== undefined || row.active !== undefined || row.clutchWindow !== undefined || row.lateWindow !== undefined) {
          const activeStart = Math.max(0, Number(row.activeStart || 0));
          const activeDuration = Math.max(1, Number(row.active || row.clutchWindow || row.lateWindow || Math.max(1, row.duration - activeStart)));
          const activeLeft = Math.max(0, Math.min(100, (((row.offset % interval) + activeStart) % interval) / interval * 100));
          const activeWidth = Math.max(2, Math.min(100 - activeLeft, activeDuration / interval * 100));
          activeNode = document.createElement('span');
          activeNode.className = row.id === 'rescue' ? 'rhythm-clutch' : 'rhythm-active';
          activeNode.style.left = `${activeLeft}%`;
          activeNode.style.width = `${activeWidth}%`;
        }
        const hit = document.createElement('span');
        hit.className = 'rhythm-hit';
        hit.style.left = `${offsetPct}%`;
        track.appendChild(windowNode);
        if (activeNode) {
          track.appendChild(activeNode);
        }
        if (row.id === 'rescue' && row.perfectWindow) {
          const perfectDuration = Math.max(1, Number(row.perfectWindow || 0));
          const perfectStart = Math.max(0, Number(row.duration || 0) - perfectDuration);
          const perfectLeft = Math.max(0, Math.min(100, (((row.offset % interval) + perfectStart) % interval) / interval * 100));
          const perfectWidth = Math.max(2, Math.min(100 - perfectLeft, perfectDuration / interval * 100));
          const perfectNode = document.createElement('span');
          perfectNode.className = 'rhythm-perfect';
          perfectNode.style.left = `${perfectLeft}%`;
          perfectNode.style.width = `${perfectWidth}%`;
          track.appendChild(perfectNode);
        }
        track.appendChild(hit);
        item.appendChild(label);
        item.appendChild(track);
        const meta = document.createElement('div');
        meta.className = 'rhythm-meta';
        meta.textContent = `${row.interval}f loop - ${rhythmMeta(row)}`;
        item.appendChild(meta);
        return item;
      }

      function applyEncounterBaseline(encounter) {
        const config = currentConfig();
        if (encounter.suggestedLevel) {
          config.level = String(encounter.suggestedLevel);
        }
        if (encounter.suggestedPreset !== undefined) {
          config.preset = encounter.suggestedPreset || 'none';
        }
        setConfig(config);
      }

      function renderEncounterInfo() {
        const info = $('encounterInfo');
        const encounter = selectedEncounter();
        info.innerHTML = '';
        if (!encounter || !encounter.id) {
          info.hidden = true;
          return;
        }
        info.hidden = false;
        const title = document.createElement('strong');
        const phase = encounter.phase ? ` - ${encounter.phase}` : '';
        title.textContent = `${encounter.kind || 'encounter'}${phase}`;
        const body = document.createElement('div');
        body.textContent = encounter.description || encounter.label || encounter.id;
        info.appendChild(title);
        info.appendChild(body);
        const intensity = selectedIntensity();
        const pressure = document.createElement('div');
        pressure.textContent = `Pressure: ${intensity.label || intensity.id || 'Standard'} - ${Number(intensity.tempo || 1).toFixed(2)}x tempo, ${Number(intensity.damage || 1).toFixed(2)}x damage`;
        info.appendChild(pressure);
        if (encounter.suggestedLevel || encounter.suggestedPreset) {
          const baseline = document.createElement('div');
          const parts = [];
          if (encounter.suggestedLevel) {
            parts.push(`L${encounter.suggestedLevel}`);
          }
          if (encounter.suggestedPreset) {
            parts.push(`${encounter.suggestedPreset} loadout`);
          }
          baseline.textContent = `Model baseline: ${parts.join(', ')}`;
          info.appendChild(baseline);

          const actions = document.createElement('div');
          actions.className = 'encounter-actions';
          const apply = document.createElement('button');
          apply.type = 'button';
          apply.className = 'secondary compact-action';
          apply.textContent = 'Apply baseline';
          apply.addEventListener('click', () => applyEncounterBaseline(encounter));
          actions.appendChild(apply);
          info.appendChild(actions);
        }
        const features = encounter.features || [];
        if (features.length) {
          const tags = document.createElement('div');
          tags.className = 'tag-list';
          features.forEach((feature) => {
            const tag = document.createElement('span');
            tag.textContent = feature;
            tags.appendChild(tag);
          });
          info.appendChild(tags);
        }
        const rhythms = resolvedRun && resolvedRun.encounter && resolvedRun.encounter.id === encounter.id
          ? (resolvedRun.rhythms || [])
          : encounterRhythms(encounter);
        if (rhythms.length) {
          const rhythmList = document.createElement('div');
          rhythmList.className = 'rhythm-list';
          rhythms.forEach((row) => {
            rhythmList.appendChild(renderRhythmTrack(row));
          });
          info.appendChild(rhythmList);
        }
      }

      function argsFor(config) {
        const args = ['engine.StartLanarts', '--class', config.className, '--level', String(config.level), '--loadout_preset', config.preset, '--settings', 'settings.yaml'];
        if (config.customLoadout) {
          args.push('--loadout', config.customLoadout);
        }
        if (config.encounter) {
          args.push('--encounter', config.encounter);
          args.push('--package_intensity', config.intensity || 'standard');
          if (config.packageComponents) {
            args.push('--package_components', config.packageComponents);
          }
        }
        if (config.monsters) {
          args.push('--monsters', config.monsters);
        } else if (!config.encounter && config.mapDesc) {
          args.push('--start_map_desc', config.mapDesc);
          if (config.mapProfile) {
            args.push('--map_profile', config.mapProfile);
          }
        }
        if (config.seed) {
          args.push('--seed', String(config.seed));
        }
        return args;
      }

      function queryFor(config, autorun) {
        const query = new URLSearchParams();
        query.set('class', config.className);
        query.set('level', config.level);
        query.set('loadout', config.preset);
        query.set('seed', config.seed);
        if (config.customLoadout) {
          query.set('items', config.customLoadout);
        }
        if (config.mapDesc) {
          query.set('map', config.mapDesc);
        }
        if (config.mapAlgorithm) {
          query.set('algo', config.mapAlgorithm);
        }
        if (config.mapProfile) {
          query.set('profile', config.mapProfile);
        }
        if (config.encounter) {
          query.set('encounter', config.encounter);
        }
        if (config.drill) {
          query.set('drill', config.drill);
        }
        if (config.intensity && config.intensity !== 'standard') {
          query.set('pressure', config.intensity);
        }
        if (config.packageComponents) {
          query.set('parts', config.packageComponents);
        }
        if (config.monsters) {
          query.set('monsters', config.monsters);
        }
        if (config.enemyGroup) {
          query.set('enemyGroup', config.enemyGroup);
        }
        if (config.enemyPack) {
          query.set('enemyPack', config.enemyPack);
        }
        if (config.goal && config.goal !== 'enemy-balance') {
          query.set('goal', config.goal);
        }
        if (config.botProfile && config.botProfile !== 'human') {
          query.set('bot', config.botProfile);
        }
        if (autorun) {

      function configFromQuery() {
        const query = new URLSearchParams(location.search);
        return {
          className: query.get('class') || 'Fighter',
          level: query.get('level') || '1',
          preset: query.get('loadout') || 'none',

          customLoadout: query.get('items') || '',
          mapDesc: query.get('map') || '',
          mapAlgorithm: query.get('algo') || '',
          mapProfile: query.get('profile') || '',
          encounter: query.get('encounter') || '',
          drill: query.get('drill') || '',
          intensity: query.get('pressure') || 'standard',
          packageComponents: query.get('parts') || '',
