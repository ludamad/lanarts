<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanarts Content Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #181c21;
      --panel-2: #20262d;
      --line: #303841;
      --text: #eef1f4;
      --muted: #a9b2bd;
      --accent: #7cc7a2;
      --accent-2: #d9b35f;
      --danger: #e07969;
      --canvas: #030405;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #14171b;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      flex: 0 0 auto;
    }

    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
    }

    .controls {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--canvas);
    }

    .canvas-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }

    #canvas {
      width: min(100%, 1280px);
      height: min(100%, 800px);
      max-height: calc(100vh - 112px);
      background: #000;
      image-rendering: pixelated;
      outline: 1px solid #242a31;
    }

    .idle-panel {
      position: absolute;
      inset: 16px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      pointer-events: none;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 0 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: stretch;
    }

    .preview {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      border: 1px solid #242b33;
      border-radius: var(--radius);
      background: #111418;
      overflow: hidden;
    }

    .preview canvas {
      width: 100%;
      height: 100%;
      min-height: 120px;
      image-rendering: pixelated;
      background: #070909;
    }

    .preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid #242b33;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      background: #151a1f;
    }

    .preview-label strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 680;
    }

    .console {
      height: 54px;
      overflow: auto;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: #0c0e11;
      color: #aeb8c4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: #d5dbe2;
      font-size: 13px;
      font-weight: 650;
    }

    select,
    input,
    textarea {
      width: 100%;
      min-height: 36px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      outline: none;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .encounter-info {
      display: grid;
      gap: 8px;
      padding: 10px;
      margin: -2px 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .encounter-info[hidden] {
      display: none;
    }

    .encounter-info strong {
      color: var(--text);
      font-size: 13px;
    }

    .run-summary {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .summary-line {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .summary-line strong {
      color: #d4dde6;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-line code {
      color: var(--accent-2);
      white-space: normal;
      word-break: break-word;
    }

    .item-chips,
    .warning-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .item-chips span,
    .warning-list span {
      padding: 3px 6px;
      border-radius: 999px;
      background: #1b2229;
      border: 1px solid #35404a;
      color: #d4dde6;
      font-size: 11px;
    }

    .warning-list span {
      color: #efd7a1;
      border-color: #4d422c;
      background: #241f16;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag-list span {
      padding: 3px 6px;
      border: 1px solid #35404a;
      border-radius: 999px;
      color: #d4dde6;
      background: #1b2229;
      font-size: 11px;
    }

    .rhythm-list {
      display: grid;
      gap: 7px;
    }

    .rhythm-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .rhythm-label {
      color: #d4dde6;
      font-size: 11px;
      white-space: nowrap;
    }

    .rhythm-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border: 1px solid #34404a;
      border-radius: 999px;
      background: #0f1317;
    }

    .rhythm-window,
    .rhythm-hit {
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .rhythm-window {
      background: rgba(217, 179, 95, 0.22);
    }

    .rhythm-hit {
      width: 2px;
      background: var(--accent-2);
    }

    .rhythm-meta {
      grid-column: 2;
      margin-top: -4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124, 199, 162, 0.18);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--line);
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      color: var(--muted);
      background: var(--panel-2);
      cursor: pointer;
    }

    .segmented button.active {
      color: #08110d;
      background: var(--accent);
      font-weight: 760;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 40px;
      border-radius: 6px;
      border: 1px solid transparent;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 760;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .primary {
      color: #07100c;
      background: var(--accent);
    }

    .secondary {
      color: var(--text);
      background: var(--panel-2);
      border-color: var(--line);
    }

    .resource-list {
      display: grid;
      gap: 8px;
    }

    .resource-group {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .resource {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #151a1f;
      cursor: pointer;
      text-align: left;
    }

    .resource strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
    }

    .resource span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .resource code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    body.running .idle-panel {
      display: none;
    }

    body.running .status-dot {
      background: var(--accent);
    }

    body.running .controls {
      opacity: 0.92;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .controls {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 620px;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Lanarts Content Lab</h1>
      <div class="status" id="status"><span class="status-dot"></span><span>Configure a run</span></div>
    </div>
    <button class="secondary" type="button" id="copyLink">Copy link</button>
  </header>

  <main class="shell">
    <aside class="controls">
      <section class="section">
        <div class="section-title">Character</div>
        <div class="field">
          <label for="className">Class</label>
          <select id="className">
            <option>Fighter</option>
            <option>Necromancer</option>
            <option>Pyrocaster</option>
            <option>Stormcaller</option>
            <option>Templar</option>
            <option>Rogue</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5 late</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8 high</option>
            </select>
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" inputmode="numeric" value="17300">
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Loadout</div>
        <div class="field">
          <div class="segmented" id="loadoutPreset">
            <button type="button" data-value="none" class="active">None</button>
            <button type="button" data-value="gragh">Gragh</button>
            <button type="button" data-value="late">Late</button>
          </div>
        </div>
        <div class="field">
          <label for="customLoadout">Custom items</label>
          <textarea id="customLoadout" spellcheck="false" placeholder="Health Potion*3, Ring of Vitality"></textarea>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Map Generation</div>
        <div class="field">
          <label for="mapDesc">Generator</label>
          <select id="mapDesc">
            <option value="">Campaign World</option>
            <option value="map_descs.Overworld">Overworld variety</option>
            <option value="map_descs.GraghsLair">Gragh's Lair</option>
            <option value="map_descs.Hell">Hell</option>
            <option value="map_descs.HiveDepths">Hive Depths</option>
            <option value="map_descs.PixullochiaDepths">Pixullochia Depths</option>
            <option value="map_descs.Crypt">Crypt</option>
            <option value="map_descs.Underdungeon">Underdungeon</option>
          </select>
        </div>
        <div class="field">
          <label for="encounter">Encounter</label>
          <select id="encounter">
            <option value="">No forced encounter</option>
            <option value="giant-chicken-duel">Giant Chicken duel</option>
            <option value="mummoner-duel">Mummoner duel</option>
            <option value="purple-dragon-package">Purple Dragon package</option>
            <option value="red-dragon-duel">Red Dragon duel</option>
            <option value="gragh-duel">Gragh duel</option>
            <option value="gragh-rescue-package">Gragh rescue package</option>
            <option value="executioner-duel">Executioner duel</option>
            <option value="hell-pressure-pair">Hell pressure pair</option>
          </select>
        </div>
        <div class="encounter-info" id="encounterInfo" hidden></div>
        <div class="field">
          <label for="intensity">Pressure</label>
          <select id="intensity">
            <option value="learning">Learning</option>
            <option value="standard" selected>Standard</option>
            <option value="high">High</option>
            <option value="brutal">Brutal</option>
          </select>
        </div>
        <div class="field">
          <label for="customMonsters">Custom monsters</label>
          <input id="customMonsters" spellcheck="false" placeholder="Mummoner, Executioner">
        </div>
        <div class="button-row">
          <button class="primary" type="button" id="launch">Launch in Emscripten</button>
          <button class="secondary" type="button" id="reseed">Seed</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Resolved Run</div>
        <div class="run-summary" id="runSummary"></div>
      </section>

      <section class="section">
        <div class="section-title">Resources</div>
        <div class="resource-list" id="resources"></div>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div class="idle-panel" id="idlePanel">
          <div class="preview-head">
            <span>Map generation previews</span>
            <span id="previewSeed"></span>
          </div>
          <div class="preview-grid" id="previewGrid"></div>
        </div>
      </div>
      <pre class="console" id="output"></pre>
    </section>
  </main>

  <script>
    const contentLab = (() => {
      const $ = (id) => document.getElementById(id);
      const state = {
        started: false,
        runtimeReady: false,
        preset: 'none',
      };

      let mapProfiles = [
        {key: '', label: 'Campaign World', mode: 'world', density: 0.30},
        {key: 'map_descs.Overworld', label: 'Overworld', mode: 'overworld', density: 0.22},
        {key: 'map_descs.GraghsLair', label: "Gragh's Lair", mode: 'lair', density: 0.36},
        {key: 'map_descs.Hell', label: 'Hell', mode: 'hell', density: 0.34},
      ];

      let encounters = [
        {id: '', label: 'No forced encounter'},
        {id: 'giant-chicken-duel', label: 'Giant Chicken duel'},
        {id: 'mummoner-duel', label: 'Mummoner duel', kind: 'duel', phase: 'summon pressure', features: ['add timing', 'targeted pulse']},
        {id: 'purple-dragon-package', label: 'Purple Dragon package', kind: 'boss package', phase: 'late micro', features: ['rotating orbs', 'targeted AOE rhythm', 'Fire Bat adds']},
        {id: 'red-dragon-duel', label: 'Red Dragon duel', kind: 'boss duel', phase: 'late micro', features: ['projectile pressure', 'targeted AOE rhythm']},
        {id: 'gragh-duel', label: 'Gragh duel', kind: 'boss duel', phase: 'late micro', features: ['melee pursuit', 'rotating orbs', 'short AOE windows']},
        {id: 'gragh-rescue-package', label: 'Gragh rescue package', kind: 'rescue package', phase: 'late multiplayer', features: ['protect ally', 'body-block rescue', 'pull/taunt window', 'rotating orbs', 'short AOE windows']},
        {id: 'executioner-duel', label: 'Executioner duel'},
        {id: 'hell-pressure-pair', label: 'Hell pressure pair', kind: 'package', phase: 'late enemy mix', features: ['support pressure', 'melee bodyguard', 'targeted pulse']},
      ];

      let intensities = [
        {id: 'learning', label: 'Learning', tempo: 0.80, damage: 0.80, summons: 0.75},
        {id: 'standard', label: 'Standard', tempo: 1.00, damage: 1.00, summons: 1.00},
        {id: 'high', label: 'High', tempo: 1.18, damage: 1.12, summons: 1.20},
        {id: 'brutal', label: 'Brutal', tempo: 1.35, damage: 1.25, summons: 1.50},
      ];

      let resources = [
        {
          name: 'Early overworld pressure',
          meta: 'L1, no loadout, Overworld',
          className: 'Necromancer',
          level: '1',
          preset: 'none',
          mapDesc: 'map_descs.Overworld',
          encounter: '',
          monsters: '',
          seed: '17300',
        },
        {
          name: 'Necromancer regen abuse',
          meta: 'L5, Gragh loadout, Gragh arena',
          className: 'Necromancer',
          level: '5',
          preset: 'gragh',
          mapDesc: 'map_descs.GraghsLair',
          encounter: '',
          monsters: '',
          seed: '12345683',
        },
        {
          name: 'Fighter late-game sanity',
          meta: 'L5, late loadout, Gragh arena',
          className: 'Fighter',
          level: '5',
          preset: 'late',
          mapDesc: 'map_descs.GraghsLair',
          encounter: '',
          monsters: '',
          seed: '12345685',
        },
        {
          name: 'Pyro conversion check',
          meta: 'L5, late loadout, Hell',
          className: 'Pyrocaster',
          level: '5',
          preset: 'late',
          mapDesc: 'map_descs.Hell',
          encounter: '',
          monsters: '',
          seed: '9500',
        },
        {
          name: 'Stormcaller comparison',
          meta: 'L5, late loadout, Hell',
          className: 'Stormcaller',
          level: '5',
          preset: 'late',
          mapDesc: 'map_descs.Hell',
          encounter: '',
          monsters: '',
          seed: '9500',
        },
      ];

      let generatedResources = [];
      let resolvedRun = null;

      function callContentApi(name, payload) {
        if (!state.runtimeReady || !Module.ccall) {
          return null;
        }
        const raw = payload === undefined
          ? Module.ccall(name, 'string', [], [])
          : Module.ccall(name, 'string', ['string'], [JSON.stringify(payload)]);
        const parsed = JSON.parse(raw);
        if (parsed && parsed.error) {
          appendOutput(parsed.error);
          return null;
        }
        return parsed;
      }

      function normalizePreviewProfile(map) {
        return {
          key: map.id || '',
          label: map.label || map.id || 'Map',
          mode: map.preview_mode || map.mode || 'world',
          density: Number(map.density || 0.30),
          palette: map.palette || null,
        };
      }

      function replaceOptions(select, entries, valueFor, labelFor) {
        const current = select.value;
        select.innerHTML = '';
        entries.forEach((entry) => {
          const option = document.createElement('option');
          option.value = valueFor(entry);
          option.textContent = labelFor(entry);
          select.appendChild(option);
        });
        if ([...select.options].some((option) => option.value === current)) {
          select.value = current;
        }
      }

      function rebuildLoadoutPresets(loadouts, names) {
        const host = $('loadoutPreset');
        host.innerHTML = '';
        (names || Object.keys(loadouts || {})).forEach((name) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.value = name;
          button.textContent = (loadouts[name] && loadouts[name].label) || name;
          button.classList.toggle('active', name === state.preset);
          button.addEventListener('click', () => {
            setPreset(name);
            refreshLab();
          });
          host.appendChild(button);
        });
      }

      function normalizeResource(resource) {
        return {
          name: resource.name,
          group: resource.group || 'Curated',
          meta: resource.meta || resource.goal || '',
          goal: resource.goal || '',
          className: resource.className,
          level: String(resource.level || 1),
          preset: resource.preset || 'none',
          intensity: resource.intensity || 'standard',
          customLoadout: resource.customLoadout || resource.loadout || '',
          mapDesc: resource.mapDesc || '',
          encounter: resource.encounter || '',
          monsters: resource.monsters || '',
          seed: String(resource.seed || 1),
        };
      }

      function applyCatalog(catalog) {
        if (!catalog) {
          return;
        }
        replaceOptions($('className'), catalog.classes || [], (entry) => entry.id, (entry) => entry.label || entry.id);
        replaceOptions($('level'), catalog.levels || [], (entry) => String(entry.value), (entry) => entry.label || String(entry.value));
        replaceOptions($('mapDesc'), catalog.maps || [], (entry) => entry.id || '', (entry) => entry.label || entry.id || 'Campaign World');
        replaceOptions($('encounter'), catalog.encounters || [], (entry) => entry.id || '', (entry) => entry.label || entry.id || 'No forced encounter');
        replaceOptions($('intensity'), catalog.intensities || intensities, (entry) => entry.id || 'standard', (entry) => entry.label || entry.id || 'Standard');
        rebuildLoadoutPresets(catalog.loadouts, catalog.loadout_names);
        encounters = catalog.encounters || encounters;
        intensities = catalog.intensities || intensities;
        resources = (catalog.resources || []).map(normalizeResource);
        mapProfiles = (catalog.maps || []).slice(0, 4).map(normalizePreviewProfile);
        wireResources();
        setConfig(currentConfig());
      }

      function hashString(value) {
        let hash = 2166136261;
        const text = String(value || '');
        for (let i = 0; i < text.length; i += 1) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function rng(seed) {
        let value = seed >>> 0;
        return () => {
          value = Math.imul(value + 0x6D2B79F5, 1);
          let t = value;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function currentConfig() {
        return {
          className: $('className').value,
          level: $('level').value,
          seed: $('seed').value.trim() || '1',
          preset: state.preset,
          intensity: $('intensity').value,
          customLoadout: $('customLoadout').value.trim(),
          mapDesc: $('mapDesc').value,
          encounter: $('encounter').value,
          monsters: $('customMonsters').value.trim(),
        };
      }

      function setPreset(value) {
        state.preset = value;
        document.querySelectorAll('#loadoutPreset button').forEach((button) => {
          button.classList.toggle('active', button.dataset.value === value);
        });
      }

      function appendSummaryLine(host, labelText, valueNode) {
        const row = document.createElement('div');
        row.className = 'summary-line';
        const label = document.createElement('strong');
        label.textContent = labelText;
        row.appendChild(label);
        row.appendChild(valueNode);
        host.appendChild(row);
      }

      function renderRunSummary(summary) {
        const host = $('runSummary');
        host.innerHTML = '';
        if (!summary) {
          const pending = document.createElement('div');
          pending.className = 'muted';
          pending.textContent = state.runtimeReady ? 'No run selected' : 'Runtime data pending';
          host.appendChild(pending);
          return;
        }

        const target = document.createElement('div');
        const targetLabel = summary.encounter && summary.encounter.id
          ? summary.encounter.label || summary.encounter.id
          : (summary.map && (summary.map.label || summary.map.id)) || 'Campaign World';
        target.textContent = `${summary.config.className} L${summary.config.level}, ${targetLabel}`;
        appendSummaryLine(host, 'Target', target);

        const loadout = document.createElement('div');
        loadout.className = 'item-chips';
        const items = (summary.loadout && summary.loadout.items) || [];
        if (items.length === 0) {
          const empty = document.createElement('span');
          empty.textContent = summary.loadout ? summary.loadout.label : 'No preset';
          loadout.appendChild(empty);
        } else {
          items.slice(0, 8).forEach((item) => {
            const chip = document.createElement('span');
            chip.textContent = item.amount > 1 ? `${item.item} x${item.amount}` : item.item;
            loadout.appendChild(chip);
          });
          if (items.length > 8) {
            const more = document.createElement('span');
            more.textContent = `+${items.length - 8}`;
            loadout.appendChild(more);
          }
        }
        appendSummaryLine(host, 'Loadout', loadout);

        if ((summary.warnings || []).length) {
          const warnings = document.createElement('div');
          warnings.className = 'warning-list';
          summary.warnings.forEach((warning) => {
            const chip = document.createElement('span');
            chip.textContent = warning;
            warnings.appendChild(chip);
          });
          appendSummaryLine(host, 'Notes', warnings);
        }

        const args = document.createElement('code');
        args.textContent = (summary.args || []).join(' ');
        appendSummaryLine(host, 'Args', args);
      }

      function updateRunSummary() {
        resolvedRun = callContentApi('lanarts_content_run_summary_json', currentConfig());
        renderRunSummary(resolvedRun);
      }

      function updateGeneratedResources() {
        const response = callContentApi('lanarts_content_resource_matrix_json', currentConfig());
        generatedResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wireResources();
      }

      function refreshLab() {
        updateRunSummary();
        drawPreviews();
        updateGeneratedResources();
      }

      function setConfig(config) {
        $('className').value = config.className || 'Fighter';
        $('level').value = String(config.level || '1');
        $('seed').value = String(config.seed || '1');
        $('customLoadout').value = config.customLoadout || '';
        $('mapDesc').value = config.mapDesc || '';
        $('encounter').value = config.encounter || '';
        $('intensity').value = config.intensity || 'standard';
        $('customMonsters').value = config.monsters || '';
        setPreset(config.preset || 'none');
        refreshLab();
      }

      function selectedEncounter() {
        const id = $('encounter').value;
        return encounters.find((entry) => (entry.id || '') === id) || null;
      }

      function selectedIntensity() {
        const id = $('intensity').value || 'standard';
        return intensities.find((entry) => (entry.id || '') === id) || intensities.find((entry) => entry.id === 'standard') || {tempo: 1, damage: 1, summons: 1};
      }

      function scaledFrames(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        const frames = Number(raw === undefined || raw === null ? 1 : raw);
        const tempo = Math.max(0.25, Number(intensity.tempo || 1));
        return Math.max(0, Math.round(frames / tempo));
      }

      function scaledDamage(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.damage || 1));
      }

      function scaledCount(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Math.max(1, Math.ceil(Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.summons || 1))));
      }

      function encounterRhythms(encounter) {
        const pkg = (encounter && encounter.package) || {};
        const intensity = selectedIntensity();
        const rows = [];
        if (pkg.orbit) {
          const duration = scaledFrames(pkg.orbit.duration, 1, intensity);
          rows.push({
            label: 'Orbs',
            offset: scaledFrames(pkg.orbit.offset, 0, intensity),
            interval: scaledFrames(pkg.orbit.interval, 1, intensity),
            duration,
            meta: `${pkg.orbit.count || 4} orbiting hitboxes, ${duration}f, damage ${scaledDamage(pkg.orbit.damage, 3, intensity).toFixed(1)}${pkg.orbit.affects_escorts ? ', hits ally' : ''}`,
          });
        }
        if (pkg.pulse) {
          const windup = scaledFrames(pkg.pulse.windup, 0, intensity);
          const active = scaledFrames(pkg.pulse.active, 1, intensity);
          rows.push({
            label: 'AOE',
            offset: scaledFrames(pkg.pulse.offset, 0, intensity),
            interval: scaledFrames(pkg.pulse.interval, 1, intensity),
            duration: windup + active,
            activeStart: windup,
            meta: `player-targeted${pkg.pulse.affects_escorts ? ' plus ally' : ''}, ${windup}f warning, ${active}f active, damage ${scaledDamage(pkg.pulse.damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.escort) {
          rows.push({
            label: 'Ally',
            offset: 0,
            interval: 600,
            duration: 600,
            meta: `protect ${pkg.escort.monster || 'ally'}, ${pkg.escort.hp || '?'} hp`,
          });
        }
        if (pkg.rescue) {
          const windup = scaledFrames(pkg.rescue.windup, 68, intensity);
          const lateWindow = scaledFrames(pkg.rescue.late_window, 22, intensity);
          rows.push({
            label: 'Rescue',
            offset: scaledFrames(pkg.rescue.offset, 54, intensity),
            interval: scaledFrames(pkg.rescue.interval, 205, intensity),
            duration: windup,
            activeStart: Math.max(0, windup - lateWindow),
            meta: `body-block line, ${lateWindow}f clutch window, ally damage ${scaledDamage(pkg.rescue.ally_damage, 10, intensity).toFixed(1)}, block damage ${scaledDamage(pkg.rescue.block_damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.summon) {
          rows.push({
            label: 'Summons',
            offset: scaledFrames(pkg.summon.offset, 0, intensity),
            interval: scaledFrames(pkg.summon.interval, 1, intensity),
            duration: 20,
            meta: `${scaledCount(pkg.summon.count, 1, intensity)} ${((pkg.summon.monsters || [])[0]) || 'add'} per wave, cap ${scaledCount(pkg.summon.max_alive, 4, intensity)}`,
          });
        }
        return rows;
      }

      function rhythmMeta(row) {
        if (row.meta) {
          return row.meta;
        }
        if (row.id === 'orbit') {
          return `${row.count || 1} orbiting hitboxes, ${row.duration || 0}f, damage ${Number(row.damage || 0).toFixed(1)}${row.affectsEscorts ? ', hits ally' : ''}`;
        }
        if (row.id === 'pulse') {
          return `player-targeted${row.affectsEscorts ? ' plus ally' : ''}, ${row.windup || 0}f warning, ${row.active || 0}f active, damage ${Number(row.damage || 0).toFixed(1)}`;
        }
        if (row.id === 'escort') {
          return `protect ${row.monster || 'ally'}, ${row.hp || '?'} hp`;
        }
        if (row.id === 'rescue') {
          return `body-block line, ${row.clutchWindow || row.lateWindow || 0}f clutch window, ally damage ${Number(row.allyDamage || 0).toFixed(1)}, block damage ${Number(row.blockDamage || 0).toFixed(1)}`;
        }
        if (row.id === 'summon') {
          const monster = ((row.monsters || [])[0]) || 'add';
          return `${row.count || 1} ${monster} per wave, cap ${row.maxAlive || 1}`;
        }
        return '';
      }

      function renderRhythmTrack(row) {
        const item = document.createElement('div');
        item.className = 'rhythm-row';
        const label = document.createElement('div');
        label.className = 'rhythm-label';
        label.textContent = row.label;
        const track = document.createElement('div');
        track.className = 'rhythm-track';
        const interval = Math.max(1, row.interval);
        const offsetPct = Math.max(0, Math.min(100, (row.offset % interval) / interval * 100));
        const durationPct = Math.max(2, Math.min(100 - offsetPct, row.duration / interval * 100));
        const windowNode = document.createElement('span');
        windowNode.className = 'rhythm-window';
        windowNode.style.left = `${offsetPct}%`;
        windowNode.style.width = `${durationPct}%`;
        const hit = document.createElement('span');
        hit.className = 'rhythm-hit';
        hit.style.left = `${offsetPct}%`;
        track.appendChild(windowNode);
        track.appendChild(hit);
        item.appendChild(label);
        item.appendChild(track);
        const meta = document.createElement('div');
        meta.className = 'rhythm-meta';
        meta.textContent = `${row.interval}f loop - ${rhythmMeta(row)}`;
        item.appendChild(meta);
        return item;
      }

      function renderEncounterInfo() {
        const info = $('encounterInfo');
        const encounter = selectedEncounter();
        info.innerHTML = '';
        if (!encounter || !encounter.id) {
          info.hidden = true;
          return;
        }
        info.hidden = false;
        const title = document.createElement('strong');
        const phase = encounter.phase ? ` - ${encounter.phase}` : '';
        title.textContent = `${encounter.kind || 'encounter'}${phase}`;
        const body = document.createElement('div');
        body.textContent = encounter.description || encounter.label || encounter.id;
        info.appendChild(title);
        info.appendChild(body);
        const intensity = selectedIntensity();
        const pressure = document.createElement('div');
        pressure.textContent = `Pressure: ${intensity.label || intensity.id || 'Standard'} - ${Number(intensity.tempo || 1).toFixed(2)}x tempo, ${Number(intensity.damage || 1).toFixed(2)}x damage`;
        info.appendChild(pressure);
        const features = encounter.features || [];
        if (features.length) {
          const tags = document.createElement('div');
          tags.className = 'tag-list';
          features.forEach((feature) => {
            const tag = document.createElement('span');
            tag.textContent = feature;
            tags.appendChild(tag);
          });
          info.appendChild(tags);
        }
        const rhythms = resolvedRun && resolvedRun.encounter && resolvedRun.encounter.id === encounter.id
          ? (resolvedRun.rhythms || [])
          : encounterRhythms(encounter);
        if (rhythms.length) {
          const rhythmList = document.createElement('div');
          rhythmList.className = 'rhythm-list';
          rhythms.forEach((row) => {
            rhythmList.appendChild(renderRhythmTrack(row));
          });
          info.appendChild(rhythmList);
        }
      }

      function argsFor(config) {
        const args = ['engine.StartLanarts', '--class', config.className, '--level', String(config.level), '--loadout_preset', config.preset, '--settings', 'settings.yaml'];
        if (config.customLoadout) {
          args.push('--loadout', config.customLoadout);
        }
        if (config.encounter) {
          args.push('--encounter', config.encounter);
          args.push('--package_intensity', config.intensity || 'standard');
        }
        if (config.monsters) {
          args.push('--monsters', config.monsters);
        } else if (!config.encounter && config.mapDesc) {
          args.push('--start_map_desc', config.mapDesc);
        }
        if (config.seed) {
          args.push('--seed', String(config.seed));
        }
        return args;
      }

      function queryFor(config, autorun) {
        const query = new URLSearchParams();
        query.set('class', config.className);
        query.set('level', config.level);
        query.set('loadout', config.preset);
        query.set('seed', config.seed);
        if (config.customLoadout) {
          query.set('items', config.customLoadout);
        }
        if (config.mapDesc) {
          query.set('map', config.mapDesc);
        }
        if (config.encounter) {
          query.set('encounter', config.encounter);
        }
        if (config.intensity && config.intensity !== 'standard') {
          query.set('pressure', config.intensity);
        }
        if (config.monsters) {
          query.set('monsters', config.monsters);
        }
        if (autorun) {
          query.set('run', '1');
        }
        return `${location.pathname}?${query.toString()}`;
      }

      function configFromQuery() {
        const query = new URLSearchParams(location.search);
        return {
          className: query.get('class') || 'Fighter',
          level: query.get('level') || '1',
          preset: query.get('loadout') || 'none',
          seed: query.get('seed') || '17300',
          customLoadout: query.get('items') || '',
          mapDesc: query.get('map') || '',
          encounter: query.get('encounter') || '',
          intensity: query.get('pressure') || 'standard',
          monsters: query.get('monsters') || '',
          autorun: query.get('run') === '1',
        };
      }

      function drawPreview(canvas, profile, seedText) {
        const ctx = canvas.getContext('2d');
        const width = 112;
        const height = 72;
        canvas.width = width;
        canvas.height = height;
        const mode = profile.mode || profile.preview_mode || 'world';
        const palette = profile.palette || {};
        const random = rng(hashString(`${seedText}:${profile.key || profile.id}:${mode}`));
        const floor = palette.floor || (mode === 'hell' ? '#6d3130' : mode === 'lair' ? '#514235' : '#31553c');
        const floor2 = palette.floor2 || (mode === 'hell' ? '#8c3e36' : mode === 'world' ? '#3a5f48' : '#416447');
        const wall = palette.wall || (mode === 'hell' ? '#281a1a' : mode === 'lair' ? '#27231f' : '#1d2922');
        const water = palette.accent || (mode === 'overworld' ? '#25465a' : '#253342');
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, width, height);

        const rooms = 6 + Math.floor(random() * 8);
        for (let i = 0; i < rooms; i += 1) {
          const cx = Math.floor(random() * width);
          const cy = Math.floor(random() * height);
          const rx = 9 + Math.floor(random() * 20 * (1 - profile.density));
          const ry = 6 + Math.floor(random() * 15 * (1 - profile.density));
          ctx.fillStyle = random() > 0.45 ? floor : floor2;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = floor2;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let i = 0; i < rooms - 1; i += 1) {
          ctx.beginPath();
          ctx.moveTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.lineTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.stroke();
        }

        if (mode === 'overworld' || mode === 'world') {
          ctx.strokeStyle = water;
          ctx.lineWidth = 3;
          ctx.beginPath();
          let y = Math.floor(random() * height);
          ctx.moveTo(0, y);
          for (let x = 0; x < width; x += 9) {
            y += Math.floor(random() * 11) - 5;
            ctx.lineTo(x, Math.max(8, Math.min(height - 8, y)));
          }
          ctx.stroke();
        }

        for (let i = 0; i < 16; i += 1) {
          ctx.fillStyle = random() > 0.5 ? '#d7c37a' : '#b6675a';
          ctx.fillRect(Math.floor(random() * width), Math.floor(random() * height), 2, 2);
        }
      }

      function drawPreviews() {
        renderEncounterInfo();
        const seed = currentConfig().seed || '1';
        $('previewSeed').textContent = `seed ${seed}`;
        const grid = $('previewGrid');
        grid.innerHTML = '';
        const previewResponse = callContentApi('lanarts_content_map_preview_json', currentConfig());
        const profiles = previewResponse && previewResponse.previews
          ? previewResponse.previews.map(normalizePreviewProfile)
          : mapProfiles;
        profiles.forEach((profile) => {
          const node = document.createElement('article');
          node.className = 'preview';
          const canvas = document.createElement('canvas');
          const label = document.createElement('div');
          label.className = 'preview-label';
          label.innerHTML = `<strong>${profile.label}</strong><span>${profile.key || 'world graph'}</span>`;
          node.appendChild(canvas);
          node.appendChild(label);
          grid.appendChild(node);
          drawPreview(canvas, profile, seed);
        });
      }

      function appendOutput(text) {
        const output = $('output');
        output.textContent += `${text}\n`;
        output.scrollTop = output.scrollHeight;
      }

      function launch(config) {
        if (!state.runtimeReady) {
          $('status').lastElementChild.textContent = 'Runtime loading';
          appendOutput('runtime is still loading');
          return;
        }
        if (state.started) {
          location.href = queryFor(config, true);
          return;
        }
        const launchResponse = callContentApi('lanarts_content_launch_args_json', config);
        const args = launchResponse && launchResponse.args ? launchResponse.args : argsFor(config);
        state.started = true;
        document.body.classList.add('running');
        $('status').lastElementChild.textContent = `${config.className} L${config.level} running`;
        appendOutput(`launch ${args.join(' ')}`);
        Module.callMain(args);
      }

      function wireResources() {
        const list = $('resources');
        list.innerHTML = '';
        let currentGroup = '';
        resources.concat(generatedResources).forEach((resource) => {
          const group = resource.group || 'Curated';
          if (group !== currentGroup) {
            currentGroup = group;
            const groupNode = document.createElement('div');
            groupNode.className = 'resource-group';
            groupNode.textContent = group;
            list.appendChild(groupNode);
          }
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'resource';
          const goal = resource.goal ? `<span>${resource.goal}</span>` : '';
          const pressure = resource.intensity && resource.intensity !== 'standard' ? ` ${resource.intensity}` : '';
          button.innerHTML = `<span><strong>${resource.name}</strong><span>${resource.meta}</span>${goal}</span><code>${resource.className} L${resource.level}${pressure}</code>`;
          button.addEventListener('click', () => {
            setConfig(resource);
          });
          list.appendChild(button);
        });
      }

      function initShell() {
        wireResources();
        setConfig(configFromQuery());
        document.querySelectorAll('#loadoutPreset button').forEach((button) => {
          button.addEventListener('click', () => {
            setPreset(button.dataset.value);
            refreshLab();
          });
        });
        ['className', 'level', 'seed', 'customLoadout', 'mapDesc', 'encounter', 'intensity', 'customMonsters'].forEach((id) => {
          $(id).addEventListener('input', refreshLab);
          $(id).addEventListener('change', refreshLab);
        });
        $('launch').disabled = true;
        $('launch').addEventListener('click', () => launch(currentConfig()));
        $('reseed').addEventListener('click', () => {
          $('seed').value = String(Math.floor(10000 + Math.random() * 900000));
          refreshLab();
        });
        $('copyLink').addEventListener('click', async () => {
          const url = `${location.origin}${queryFor(currentConfig(), false)}`;
          try {
            await navigator.clipboard.writeText(url);
            $('status').lastElementChild.textContent = 'Link copied';
          } catch (err) {
            appendOutput(url);
          }
        });
      }

      function runtimeReady() {
        const queryConfig = configFromQuery();
        state.runtimeReady = true;
        $('launch').disabled = false;
        $('status').lastElementChild.textContent = 'Runtime ready';
        applyCatalog(callContentApi('lanarts_content_catalog_json'));
        setConfig(queryConfig);
        if (queryConfig.autorun) {
          setTimeout(() => launch(currentConfig()), 0);
        }
      }

      return {initShell, runtimeReady, appendOutput};
    })();

    var Module = {
      noInitialRun: true,
      canvas: document.getElementById('canvas'),
      print: function(text) {
        contentLab.appendOutput(text);
      },
      printErr: function(text) {
        contentLab.appendOutput(text);
      },
      preRun: [function() {
        if (typeof ENV !== 'undefined') {
          ENV.LANARTS_MUTE_AUDIO = '1';
          ENV.LANARTS_ENABLE_AUDIO = '0';
          ENV.SDL_AUDIODRIVER = 'dummy';
        }
      }],
      setStatus: function(text) {
        if (text) {
          document.getElementById('status').lastElementChild.textContent = text;
        }
      },
      onAbort: function(reason) {
        document.getElementById('status').lastElementChild.textContent = 'Runtime aborted';
        contentLab.appendOutput(reason || 'abort');
      },
      onRuntimeInitialized: function() {
        contentLab.runtimeReady();
      },
    };

    contentLab.initShell();
  </script>
