<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanarts Content Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101215;
      --panel: #181c21;
      --panel-2: #20262d;
      --line: #303841;
      --text: #eef1f4;
      --muted: #a9b2bd;
      --accent: #7cc7a2;
      --accent-2: #d9b35f;
      --danger: #e07969;
      --canvas: #030405;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #14171b;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      flex: 0 0 auto;
    }

    .shell {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
    }

    .controls {
      min-height: 0;
      overflow: auto;
      padding: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--canvas);
    }

    .canvas-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 16px;
      overflow: hidden;
    }

    #canvas {
      width: min(100%, 1280px);
      height: min(100%, 800px);
      max-height: calc(100vh - 112px);
      background: #000;
      image-rendering: pixelated;
      outline: 1px solid #242a31;
    }

    .idle-panel {
      position: absolute;
      inset: 16px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      pointer-events: none;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 0 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .preview-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-content: stretch;
    }

    .preview {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      border: 1px solid #242b33;
      border-radius: var(--radius);
      background: #111418;
      overflow: hidden;
      pointer-events: auto;
      cursor: pointer;
    }

    .preview canvas {
      width: 100%;
      height: 100%;
      min-height: 120px;
      image-rendering: pixelated;
      background: #070909;
    }

    .preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid #242b33;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      background: #151a1f;
    }

    .preview-label strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 680;
    }

    .console {
      height: 54px;
      overflow: auto;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: #0c0e11;
      color: #aeb8c4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      color: #d5dbe2;
      font-size: 13px;
      font-weight: 650;
    }

    select,
    input,
    textarea {
      width: 100%;
      min-height: 36px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      outline: none;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    .encounter-info,
    .build-info {
      display: grid;
      gap: 8px;
      padding: 10px;
      margin: -2px 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .encounter-info[hidden] {
      display: none;
    }

    .encounter-info strong {
      color: var(--text);
      font-size: 13px;
    }

    .encounter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .compact-action {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 11px;
      line-height: 1.2;
    }

    .build-info:empty {
      display: none;
    }

    .run-summary {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .summary-line {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }

    .summary-line strong {
      color: #d4dde6;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-line code {
      color: var(--accent-2);
      white-space: normal;
      word-break: break-word;
    }

    .item-chips,
    .warning-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .item-chips span,
    .warning-list span {
      padding: 3px 6px;
      border-radius: 999px;
      background: #1b2229;
      border: 1px solid #35404a;
      color: #d4dde6;
      font-size: 11px;
    }

    .warning-list span {
      color: #efd7a1;
      border-color: #4d422c;
      background: #241f16;
    }

    .item-chips span.locked {
      color: var(--muted);
      border-color: #303841;
      background: #151a1f;
    }

    .item-chips span.stat {
      color: #ffffff;
      border-color: #486757;
      background: #1c2b25;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag-list span {
      padding: 3px 6px;
      border: 1px solid #35404a;
      border-radius: 999px;
      color: #d4dde6;
      background: #1b2229;
      font-size: 11px;
    }

    .pick-list {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #14191e;
    }

    .pick-group {
      display: grid;
      gap: 5px;
    }

    .pick-group strong {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .pick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pick-buttons button {
      min-height: 28px;
      border: 1px solid #35404a;
      border-radius: 6px;
      padding: 4px 7px;
      color: #d4dde6;
      background: #1b2229;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
    }

    .pick-buttons button.active {
      border-color: #6b8fbd;
      color: #ffffff;
      background: #223247;
    }

    .loadout-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 28px;
    }

    .loadout-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 100%;
      border: 1px solid #35404a;
      border-radius: 6px;
      background: #1b2229;
      color: #d4dde6;
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
    }

    .loadout-chip span {
      padding: 4px 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loadout-chip button {
      align-self: stretch;
      width: 24px;
      border: 0;
      border-left: 1px solid #35404a;
      background: #14191e;
      color: #d4dde6;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    .rhythm-list {
      display: grid;
      gap: 7px;
    }

    .rhythm-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .rhythm-label {
      color: #d4dde6;
      font-size: 11px;
      white-space: nowrap;
    }

    .rhythm-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border: 1px solid #34404a;
      border-radius: 999px;
      background: #0f1317;
    }

    .rhythm-window,
    .rhythm-active,
    .rhythm-clutch,
    .rhythm-hit {
      position: absolute;
      top: 0;
      bottom: 0;
    }

    .rhythm-window {
      background: rgba(217, 179, 95, 0.22);
      z-index: 1;
    }

    .rhythm-active {
      background: rgba(124, 199, 162, 0.44);
      z-index: 2;
    }

    .rhythm-clutch {
      background: rgba(224, 121, 105, 0.58);
      z-index: 2;
    }

    .rhythm-hit {
      width: 2px;
      background: var(--accent-2);
      z-index: 3;
    }

    .rhythm-meta {
      grid-column: 2;
      margin-top: -4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124, 199, 162, 0.18);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--line);
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      color: var(--muted);
      background: var(--panel-2);
      cursor: pointer;
    }

    .segmented button.active {
      color: #08110d;
      background: var(--accent);
      font-weight: 760;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .primary,
    .secondary {
      min-height: 40px;
      border-radius: 6px;
      border: 1px solid transparent;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 760;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .primary {
      color: #07100c;
      background: var(--accent);
    }

    .secondary {
      color: var(--text);
      background: var(--panel-2);
      border-color: var(--line);
    }

    .resource-list {
      display: grid;
      gap: 8px;
    }

    .resource-group {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .resource {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #151a1f;
      cursor: pointer;
      text-align: left;
    }

    .resource strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
    }

    .resource span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .resource code {
      color: var(--accent-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    body.running .idle-panel {
      display: none;
    }

    body.running .status-dot {
      background: var(--accent);
    }

    body.running .controls {
      opacity: 0.92;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .controls {
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 620px;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Lanarts Content Lab</h1>
      <div class="status" id="status"><span class="status-dot"></span><span>Configure a run</span></div>
    </div>
    <button class="secondary" type="button" id="copyLink">Copy link</button>
  </header>

  <main class="shell">
    <aside class="controls">
      <section class="section">
        <div class="section-title">Character</div>
        <div class="field">
          <label for="className">Class</label>
          <select id="className">
            <option>Fighter</option>
            <option>Necromancer</option>
            <option>Pyrocaster</option>
            <option>Stormcaller</option>
            <option>Templar</option>
            <option>Rogue</option>
          </select>
        </div>
        <div class="row">
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5 late</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8 high</option>
            </select>
          </div>
          <div class="field">
            <label for="seed">Seed</label>
            <input id="seed" inputmode="numeric" value="17300">
          </div>
        </div>
        <div class="build-info" id="buildInfo"></div>
      </section>

      <section class="section">
        <div class="section-title">Loadout</div>
        <div class="field">
          <div class="segmented" id="loadoutPreset">
            <button type="button" data-value="none" class="active">None</button>
            <button type="button" data-value="gragh">Gragh</button>
            <button type="button" data-value="late">Late</button>
          </div>
        </div>
        <div class="field">
          <label for="customLoadout">Custom items</label>
          <textarea id="customLoadout" spellcheck="false" placeholder="Health Potion*3, Ring of Vitality"></textarea>
          <div class="loadout-chips" id="activeLoadout"></div>
        </div>
        <div class="field">
          <label for="itemChoices">Items</label>
          <div class="pick-list" id="itemChoices"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Map Generation</div>
        <div class="field">
          <label for="mapDesc">Generator</label>
          <select id="mapDesc">
            <option value="">Campaign World</option>
            <option value="map_descs.Overworld">Overworld variety</option>
            <option value="map_descs.GraghsLair">Gragh's Lair</option>
            <option value="map_descs.Hell">Hell</option>
            <option value="map_descs.HiveDepths">Hive Depths</option>
            <option value="map_descs.PixullochiaDepths">Pixullochia Depths</option>
            <option value="map_descs.Crypt">Crypt</option>
            <option value="map_descs.Underdungeon">Underdungeon</option>
          </select>
        </div>
        <div class="field">
          <label for="mapAlgorithm">Algorithm</label>
          <select id="mapAlgorithm">
            <option value="">Default</option>
            <option value="overworld-random">Overworld mix</option>
            <option value="overworld-open-meadow">Open meadow</option>
            <option value="overworld-broken-grove">Broken grove</option>
            <option value="overworld-old-stones">Old stones</option>
            <option value="overworld-river-road">River road</option>
            <option value="overworld-predator-thicket">Predator thicket</option>
            <option value="overworld-ruin-crossroads">Ruin crossroads</option>
          </select>
        </div>
        <div class="field">
          <label for="encounter">Encounter</label>
          <select id="encounter">
            <option value="">No forced encounter</option>
            <option value="giant-chicken-duel">Giant Chicken package</option>
            <option value="mummoner-duel">Mummoner package</option>
            <option value="purple-dragon-package">Purple Dragon package</option>
            <option value="red-dragon-duel">Red Dragon package</option>
            <option value="gragh-duel">Gragh package</option>
            <option value="gragh-rescue-package">Gragh rescue package</option>
            <option value="executioner-duel">Executioner baseline duel</option>
            <option value="executioner-blade-package">Executioner blade package</option>
            <option value="executioner-rescue-package">Executioner rescue package</option>
            <option value="hell-pressure-pair">Hell pressure pair</option>
            <option value="centaur-volley-package">Centaur Hunter volley package</option>
            <option value="crypt-keeper-aura-package">Crypt Keeper aura package</option>
          </select>
        </div>
        <div class="encounter-info" id="encounterInfo" hidden></div>
        <div class="field">
          <label for="intensity">Pressure</label>
          <select id="intensity">
            <option value="learning">Learning</option>
            <option value="standard" selected>Standard</option>
            <option value="high">High</option>
            <option value="brutal">Brutal</option>
          </select>
        </div>
        <div class="field">
          <label for="packageComponents">Package parts</label>
          <select id="packageComponents">
            <option value="">Full package</option>
            <option value="orbit">Orbs only</option>
            <option value="pulse">AOE only</option>
            <option value="summon">Adds only</option>
            <option value="escort,rescue">Rescue lane</option>
            <option value="escort,orbit,pulse,rescue">No adds</option>
            <option value="orbit,pulse,summon">No rescue</option>
          </select>
        </div>
        <div class="field">
          <label for="customMonsters">Custom monsters</label>
          <input id="customMonsters" spellcheck="false" placeholder="Mummoner, Executioner">
        </div>
        <div class="row">
          <div class="field">
            <label for="enemyGroup">Enemy group</label>
            <select id="enemyGroup">
              <option value="overworld-ambient">Overworld ambient</option>
            </select>
          </div>
          <div class="field">
            <label for="enemyPack">Enemy pack</label>
            <select id="enemyPack">
              <option value="">None</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="enemyChoices">Enemy probes</label>
          <div class="pick-list" id="enemyChoices"></div>
        </div>
        <div class="button-row">
          <button class="primary" type="button" id="launch">Launch in Emscripten</button>
          <button class="secondary" type="button" id="reseed">Seed</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">Resolved Run</div>
        <div class="run-summary" id="runSummary"></div>
      </section>

      <section class="section">
        <div class="section-title">Resources</div>
        <div class="row">
          <div class="field">
            <label for="analysisGoal">Goal</label>
            <select id="analysisGoal">
              <option value="enemy-balance">Enemy balance</option>
            </select>
          </div>
          <div class="field">
            <label for="botProfile">Bot skill</label>
            <select id="botProfile">
              <option value="perfect">Perfect</option>
              <option value="skilled">Skilled</option>
              <option value="human" selected>Human</option>
              <option value="sloppy">Sloppy</option>
            </select>
          </div>
        </div>
        <div class="run-summary" id="analysisPlan"></div>
      </section>

      <section class="section">
        <div class="section-title">Map Matrix</div>
        <div class="resource-list" id="mapResources"></div>
      </section>

      <section class="section">
        <div class="section-title">Package Matrix</div>
        <div class="resource-list" id="packageResources"></div>
      </section>

      <section class="section">
        <div class="section-title">All Resources</div>
        <div class="resource-list" id="resources"></div>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div class="idle-panel" id="idlePanel">
          <div class="preview-head">
            <span>Map generation previews</span>
            <span id="previewSeed"></span>
          </div>
          <div class="preview-grid" id="previewGrid"></div>
        </div>
      </div>
      <pre class="console" id="output"></pre>
    </section>
  </main>

  <script>
    const contentLab = (() => {
      const $ = (id) => document.getElementById(id);
      const state = {
        started: false,
        runtimeReady: false,
        preset: 'none',

        if (!state.runtimeReady || !Module.ccall) {
          return null;

        try {
          const raw = payload === undefined
            ? Module.ccall(name, 'string', [], [])
            : Module.ccall(name, 'string', ['string'], [JSON.stringify(payload)]);
          const parsed = JSON.parse(raw);
          if (parsed && parsed.error) {
            appendOutput(parsed.error);
            return null;
          }
          return parsed;
        } catch (err) {
          appendOutput(`${name} failed: ${err && err.message ? err.message : err}`);
          return null;
        }

        const filtered = mapAlgorithms.filter((entry) => (entry.mapDesc || '') === (mapDesc || ''));

      }

      function mapAlgorithmIdFor(mapDesc, mapProfile) {
        const exact = mapAlgorithms.find((entry) => (entry.mapDesc || '') === (mapDesc || '') && (entry.mapProfile || '') === (mapProfile || ''));
        if (exact) {
          return exact.id || '';
        }
        const fallback = mapAlgorithms.find((entry) => (entry.mapDesc || '') === (mapDesc || '') && !(entry.mapProfile || ''));
        return fallback ? (fallback.id || '') : '';
      }

      function hashString(value) {
        let hash = 2166136261;
        const text = String(value || '');
        for (let i = 0; i < text.length; i += 1) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function rng(seed) {
        let value = seed >>> 0;
        return () => {
          value = Math.imul(value + 0x6D2B79F5, 1);
          let t = value;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

        const args = document.createElement('code');
        args.textContent = commandText(summary.args);
        appendSummaryLine(host, 'Args', args);

        const balanceArgs = document.createElement('code');
        balanceArgs.textContent = commandText(summary.balanceArgs);
        appendSummaryLine(host, 'Balance', balanceArgs);
      }

      function addChip(host, text, className) {
        const chip = document.createElement('span');
        chip.textContent = text;
        if (className) {
          chip.className = className;
        }
        host.appendChild(chip);
      }

      function spellChipText(spell) {
        const role = spell.role ? ` ${spell.role}` : '';
        return `L${spell.level || 1} ${spell.name}${role}`;
      }

      function renderBuildOptions(options) {
        const buildHost = $('buildInfo');
        const itemHost = $('itemChoices');
        buildHost.innerHTML = '';
        itemHost.innerHTML = '';
        if (!options) {
          return;
        }

        const build = options.classBuild || {};
        const basics = document.createElement('div');
        basics.className = 'item-chips';
        if (build.starting_weapon) {
          addChip(basics, build.starting_weapon);
        }
        ((build.starting_items || [])).forEach((item) => addChip(basics, item));
        if (basics.childElementCount > 0) {
          buildHost.appendChild(basics);
        }

        if (options.resolvedStats && (options.resolvedStats.rows || []).length) {
          const stats = document.createElement('div');
          stats.className = 'item-chips';
          (options.resolvedStats.rows || []).forEach((row) => {
            addChip(stats, `${row.label} ${row.value}`, 'stat');
          });
          buildHost.appendChild(stats);
        }

        if (options.controlModel) {
          const control = document.createElement('div');
          control.className = 'item-chips';
          const model = options.controlModel;
          const profile = model.botProfile || {};
          addChip(control, profile.label || profile.id || 'Human');
          addChip(control, model.positioning || model.classRange || 'positioning');
          addChip(control, `${model.targetDistance || 0}px target`);
          if (model.notes) {
            addChip(control, model.notes);
          }
          buildHost.appendChild(control);
        }

        const known = options.knownSpells || [];
        const upcoming = options.upcomingSpells || [];
        if (known.length || upcoming.length) {
          const spellRow = document.createElement('div');
          spellRow.className = 'item-chips';
          known.forEach((spell) => addChip(spellRow, spellChipText(spell)));
          upcoming.forEach((spell) => addChip(spellRow, spellChipText(spell), 'locked'));
          buildHost.appendChild(spellRow);
        }

        const selectedItems = new Set(customLoadoutParts());
        (options.itemChoices || []).forEach((group) => {
          const groupNode = document.createElement('div');
          groupNode.className = 'pick-group';
          const label = document.createElement('strong');
          label.textContent = group.label || group.id || 'Items';
          const buttons = document.createElement('div');
          buttons.className = 'pick-buttons';
          (group.choices || []).forEach((choice) => {
            const button = document.createElement('button');
            button.type = 'button';
            const spec = choice.spec || choice.name;
            const selected = selectedItems.has(spec);
            button.textContent = choice.amount > 1 ? `${choice.name} x${choice.amount}` : choice.name;
            button.classList.toggle('active', selected);
            button.setAttribute('aria-pressed', selected ? 'true' : 'false');
            button.title = selected ? `Remove ${spec}` : `Add ${spec}`;
            button.addEventListener('click', () => {
              toggleItemSpec(spec);
            });
            buttons.appendChild(button);
          });
          groupNode.appendChild(label);
          groupNode.appendChild(buttons);
          itemHost.appendChild(groupNode);
        });
      }

      function renderEnemyOptions(options) {
        const host = $('enemyChoices');
        host.innerHTML = '';
        const choices = options && options.choices && options.choices.length
          ? options.choices
          : ((enemyGroups.find((group) => (group.id || '') === ($('enemyGroup').value || '')) || {}).choices || []);
        if (!choices.length) {
          const empty = document.createElement('div');
          empty.className = 'muted';
          empty.textContent = 'No enemy probes';
          host.appendChild(empty);
          return;
        }
        const groupNode = document.createElement('div');
        groupNode.className = 'pick-group';
        const buttons = document.createElement('div');
        buttons.className = 'pick-buttons';
        choices.forEach((choice) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = choice.name;
          button.title = choice.role || '';
          button.addEventListener('click', () => {
            $('customMonsters').value = choice.name;
            $('encounter').value = '';
            $('enemyPack').value = '';
            refreshLab();
          });
          buttons.appendChild(button);
        });
        groupNode.appendChild(buttons);
        host.appendChild(groupNode);
      }

      function appendCommandLine(host, labelText, command) {
        const code = document.createElement('code');
        code.textContent = commandText(command);
        appendSummaryLine(host, labelText, code);
      }

      function renderAnalysisPlan(plan) {
        const host = $('analysisPlan');
        host.innerHTML = '';
        if (!plan) {
          const pending = document.createElement('div');
          pending.className = 'muted';
          pending.textContent = state.runtimeReady ? 'No plan selected' : 'Runtime data pending';
          host.appendChild(pending);
          return;
        }
        const goal = document.createElement('div');
        goal.textContent = plan.goal ? (plan.goal.label || plan.goal.id) : 'Enemy balance';
        appendSummaryLine(host, 'Goal', goal);

        const counts = document.createElement('div');
        const enemyCount = plan.enemyMatrix ? Number(plan.enemyMatrix.count || 0) : 0;
        const previewCount = plan.mapGeneration && plan.mapGeneration.previews ? plan.mapGeneration.previews.length : 0;
        const profileCount = botProfiles.length || 0;
        counts.textContent = `${enemyCount} enemy probes, ${previewCount} map previews, ${profileCount} skill profiles`;
        appendSummaryLine(host, 'Coverage', counts);

        const commands = plan.commands || {};
        appendCommandLine(host, 'Launch', commands.launch);
        appendCommandLine(host, 'Balance', commands.balance);
        appendCommandLine(host, 'Classes', commands.classSweep);
        appendCommandLine(host, 'Monster', commands.monsterEval);
      }

      function customLoadoutParts() {
        return $('customLoadout').value.split(',').map((part) => part.trim()).filter(Boolean);
      }

      function setCustomLoadoutParts(parts) {
        $('customLoadout').value = parts.map((part) => String(part || '').trim()).filter(Boolean).join(', ');
      }

      function renderCustomLoadout() {
        const host = $('activeLoadout');
        host.innerHTML = '';
        customLoadoutParts().forEach((part, index) => {
          const chip = document.createElement('div');
          chip.className = 'loadout-chip';
          const label = document.createElement('span');
          label.textContent = part;
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = 'x';
          remove.title = `Remove ${part}`;
          remove.addEventListener('click', () => {
            const next = customLoadoutParts();
            next.splice(index, 1);
            setCustomLoadoutParts(next);
            refreshLab();
          });
          chip.appendChild(label);
          chip.appendChild(remove);
          host.appendChild(chip);
        });
      }

      function addItemSpec(spec) {
        const next = String(spec || '').trim();
        if (!next) {
          return;
        }
        const parts = customLoadoutParts();
        if (!parts.includes(next)) {
          parts.push(next);
          setCustomLoadoutParts(parts);
        }
        refreshLab();
      }

      function removeItemSpec(spec) {
        const target = String(spec || '').trim();
        if (!target) {
          return;
        }
        setCustomLoadoutParts(customLoadoutParts().filter((part) => part !== target));
        refreshLab();
      }

      function toggleItemSpec(spec) {
        const target = String(spec || '').trim();
        if (!target) {
          return;
        }
        if (customLoadoutParts().includes(target)) {
          removeItemSpec(target);
        } else {
          addItemSpec(target);
        }
      }

      function updateLoadoutOptions() {
        loadoutOptions = callContentApi('lanarts_content_loadout_options_json', currentConfig());
        renderBuildOptions(loadoutOptions);
      }

      function updateRunSummary() {
        resolvedRun = callContentApi('lanarts_content_run_summary_json', currentConfig());
        renderRunSummary(resolvedRun);
      }

      function updateEnemyOptions() {
        enemyOptions = callContentApi('lanarts_content_enemy_options_json', currentConfig());
        renderEnemyOptions(enemyOptions);
      }

      function updateAnalysisPlan() {
        analysisPlan = callContentApi('lanarts_content_analysis_plan_json', currentConfig());
        renderAnalysisPlan(analysisPlan);
      }

      function updateGeneratedResources() {
        const response = callContentApi('lanarts_content_resource_matrix_json', currentConfig());
        generatedResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wireResources();
      }

      function updateMapResources() {
        const response = callContentApi('lanarts_content_map_matrix_json', currentConfig());
        mapResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wireMapResources();
      }

      function updatePackageResources() {
        const response = callContentApi('lanarts_content_package_matrix_json', currentConfig());
        packageResources = response && response.resources ? response.resources.map(normalizeResource) : [];
        wirePackageResources();
      }

      function updateWorkspace() {
        workspace = callContentApi('lanarts_content_workspace_json', currentConfig());
        if (!workspace) {
          return false;
        }
        loadoutOptions = workspace.loadoutOptions || null;
        resolvedRun = workspace.runSummary || null;
        enemyOptions = workspace.enemyOptions || null;
        analysisPlan = workspace.analysisPlan || null;
        mapResources = workspace.mapMatrix && workspace.mapMatrix.resources
          ? workspace.mapMatrix.resources.map(normalizeResource)
          : [];
        packageResources = workspace.packageMatrix && workspace.packageMatrix.resources
          ? workspace.packageMatrix.resources.map(normalizeResource)
          : [];
        generatedResources = workspace.resourceMatrix && workspace.resourceMatrix.resources
          ? workspace.resourceMatrix.resources.map(normalizeResource)
          : [];
        renderBuildOptions(loadoutOptions);
        renderRunSummary(resolvedRun);
        renderEnemyOptions(enemyOptions);
        renderAnalysisPlan(analysisPlan);
        drawPreviews(workspace.mapGeneration);
        wireMapResources();
        wirePackageResources();
        wireResources();
        return true;
      }

      function refreshLab() {
        renderCustomLoadout();
        if (updateWorkspace()) {
          return;
        }
        updateLoadoutOptions();
        updateRunSummary();
        updateEnemyOptions();
        updateAnalysisPlan();
        drawPreviews();
        updateMapResources();
        updatePackageResources();
        updateGeneratedResources();
      }

      function setConfig(config) {
        $('className').value = config.className || 'Fighter';
        $('level').value = String(config.level || '1');
        $('seed').value = String(config.seed || '1');
        $('customLoadout').value = config.customLoadout || '';
        $('mapDesc').value = config.mapDesc || '';
        rebuildMapAlgorithms($('mapDesc').value, config.mapAlgorithm || mapAlgorithmIdFor(config.mapDesc || '', config.mapProfile || ''));
        $('mapAlgorithm').value = config.mapAlgorithm || mapAlgorithmIdFor(config.mapDesc || '', config.mapProfile || '');
        $('encounter').value = config.encounter || '';
        $('intensity').value = config.intensity || 'standard';
        $('packageComponents').value = config.packageComponents || '';
        $('customMonsters').value = config.monsters || '';
        $('enemyGroup').value = config.enemyGroup || $('enemyGroup').value || 'overworld-ambient';
        $('enemyPack').value = config.enemyPack || '';
        const goalId = config.analysisGoal || config.goalId || (analysisGoals.some((entry) => entry.id === config.goal) ? config.goal : '');
        $('analysisGoal').value = goalId || 'enemy-balance';
        $('botProfile').value = config.botProfile || 'human';
        setPreset(config.preset || 'none');
        refreshLab();
      }

      function selectedEncounter() {
        const id = $('encounter').value;
        return encounters.find((entry) => (entry.id || '') === id) || null;
      }

      function selectedIntensity() {
        const id = $('intensity').value || 'standard';
        return intensities.find((entry) => (entry.id || '') === id) || intensities.find((entry) => entry.id === 'standard') || {tempo: 1, damage: 1, summons: 1};
      }

      function scaledFrames(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        const frames = Number(raw === undefined || raw === null ? 1 : raw);
        const tempo = Math.max(0.25, Number(intensity.tempo || 1));
        return Math.max(0, Math.round(frames / tempo));
      }

      function scaledDamage(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.damage || 1));
      }

      function scaledCount(value, fallback, intensity) {
        const raw = value === undefined || value === null ? fallback : value;
        return Math.max(1, Math.ceil(Number(raw === undefined || raw === null ? 1 : raw) * Math.max(0.1, Number(intensity.summons || 1))));
      }

      function componentSet(value) {
        const parts = String(value || '').split(',').map((part) => part.trim()).filter(Boolean);
        if (!parts.length) {
          return null;
        }
        const set = new Set(parts);
        if (set.has('rescue')) {
          set.add('escort');
        }
        return set;
      }

      function packageForComponents(pkg, components) {
        const selected = componentSet(components);
        if (!selected) {
          return pkg || {};
        }
        const result = {primary: pkg.primary};
        ['escort', 'orbit', 'pulse', 'summon', 'rescue'].forEach((key) => {
          if (selected.has(key) && pkg[key]) {
            result[key] = pkg[key];
          }
        });
        return result;
      }

      function encounterRhythms(encounter) {
        const pkg = packageForComponents((encounter && encounter.package) || {}, $('packageComponents').value || '');
        const intensity = selectedIntensity();
        const rows = [];
        if (pkg.orbit) {
          const duration = scaledFrames(pkg.orbit.duration, 1, intensity);
          rows.push({
            id: 'orbit',
            label: 'Orbs',
            offset: scaledFrames(pkg.orbit.offset, 0, intensity),
            interval: scaledFrames(pkg.orbit.interval, 1, intensity),
            duration,
            meta: `${pkg.orbit.count || 4} orbiting hitboxes, ${duration}f, damage ${scaledDamage(pkg.orbit.damage, 3, intensity).toFixed(1)}${pkg.orbit.affects_escorts ? ', hits ally' : ''}`,
          });
        }
        if (pkg.pulse) {
          const windup = scaledFrames(pkg.pulse.windup, 0, intensity);
          const active = scaledFrames(pkg.pulse.active, 1, intensity);
          rows.push({
            id: 'pulse',
            label: 'AOE',
            offset: scaledFrames(pkg.pulse.offset, 0, intensity),
            interval: scaledFrames(pkg.pulse.interval, 1, intensity),
            duration: windup + active,
            activeStart: windup,
            active,
            meta: `player-targeted${pkg.pulse.affects_escorts ? ' plus ally' : ''}, ${windup}f warning, ${active}f active, damage ${scaledDamage(pkg.pulse.damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.escort) {
          rows.push({
            id: 'escort',
            label: 'Ally',
            offset: 0,
            interval: 600,
            duration: 600,
            meta: `protect ${pkg.escort.monster || 'ally'}, ${pkg.escort.hp || '?'} hp`,
          });
        }
        if (pkg.rescue) {
          const windup = scaledFrames(pkg.rescue.windup, 68, intensity);
          const lateWindow = scaledFrames(pkg.rescue.late_window, 22, intensity);
          const pullFrames = scaledFrames(pkg.rescue.pull_frames, 90, intensity);
          rows.push({
            id: 'rescue',
            label: 'Rescue',
            offset: scaledFrames(pkg.rescue.offset, 54, intensity),
            interval: scaledFrames(pkg.rescue.interval, 205, intensity),
            duration: windup,
            activeStart: Math.max(0, windup - lateWindow),
            clutchWindow: lateWindow,
            pullFrames,
            meta: `body-block line, ${lateWindow}f clutch window, ${pullFrames}f pull, ally damage ${scaledDamage(pkg.rescue.ally_damage, 10, intensity).toFixed(1)}, block damage ${scaledDamage(pkg.rescue.block_damage, 4, intensity).toFixed(1)}`,
          });
        }
        if (pkg.summon) {
          rows.push({
            id: 'summon',
            label: 'Summons',
            offset: scaledFrames(pkg.summon.offset, 0, intensity),
            interval: scaledFrames(pkg.summon.interval, 1, intensity),
            duration: 20,
            meta: `${scaledCount(pkg.summon.count, 1, intensity)} ${((pkg.summon.monsters || [])[0]) || 'add'} per wave, cap ${scaledCount(pkg.summon.max_alive, 4, intensity)}`,
          });
        }
        return rows;
      }

      function rhythmMeta(row) {
        if (row.meta) {
          return row.meta;
        }
        if (row.id === 'orbit') {
          return `${row.count || 1} orbiting hitboxes, ${row.duration || 0}f, damage ${Number(row.damage || 0).toFixed(1)}${row.affectsEscorts ? ', hits ally' : ''}`;
        }
        if (row.id === 'pulse') {
          return `player-targeted${row.affectsEscorts ? ' plus ally' : ''}, ${row.windup || 0}f warning, ${row.active || 0}f active, damage ${Number(row.damage || 0).toFixed(1)}`;
        }
        if (row.id === 'escort') {
          return `protect ${row.monster || 'ally'}, ${row.hp || '?'} hp`;
        }
        if (row.id === 'rescue') {
          const pull = row.pullFrames ? `, ${row.pullFrames}f pull` : '';
          return `body-block line, ${row.clutchWindow || row.lateWindow || 0}f clutch window${pull}, ally damage ${Number(row.allyDamage || 0).toFixed(1)}, block damage ${Number(row.blockDamage || 0).toFixed(1)}`;
        }
        if (row.id === 'summon') {
          const monster = ((row.monsters || [])[0]) || 'add';
          return `${row.count || 1} ${monster} per wave, cap ${row.maxAlive || 1}`;
        }
        return '';
      }

      function renderRhythmTrack(row) {
        const item = document.createElement('div');
        item.className = 'rhythm-row';
        const label = document.createElement('div');
        label.className = 'rhythm-label';
        label.textContent = row.label;
        const track = document.createElement('div');
        track.className = 'rhythm-track';
        const interval = Math.max(1, row.interval);
        const offsetPct = Math.max(0, Math.min(100, (row.offset % interval) / interval * 100));
        const durationPct = Math.max(2, Math.min(100 - offsetPct, row.duration / interval * 100));
        const windowNode = document.createElement('span');
        windowNode.className = 'rhythm-window';
        windowNode.style.left = `${offsetPct}%`;
        windowNode.style.width = `${durationPct}%`;
        let activeNode = null;
        if (row.activeStart !== undefined || row.active !== undefined || row.clutchWindow !== undefined || row.lateWindow !== undefined) {
          const activeStart = Math.max(0, Number(row.activeStart || 0));
          const activeDuration = Math.max(1, Number(row.active || row.clutchWindow || row.lateWindow || Math.max(1, row.duration - activeStart)));
          const activeLeft = Math.max(0, Math.min(100, (((row.offset % interval) + activeStart) % interval) / interval * 100));
          const activeWidth = Math.max(2, Math.min(100 - activeLeft, activeDuration / interval * 100));
          activeNode = document.createElement('span');
          activeNode.className = row.id === 'rescue' ? 'rhythm-clutch' : 'rhythm-active';
          activeNode.style.left = `${activeLeft}%`;
          activeNode.style.width = `${activeWidth}%`;
        }
        const hit = document.createElement('span');
        hit.className = 'rhythm-hit';
        hit.style.left = `${offsetPct}%`;
        track.appendChild(windowNode);
        if (activeNode) {
          track.appendChild(activeNode);
        }
        track.appendChild(hit);
        item.appendChild(label);
        item.appendChild(track);
        const meta = document.createElement('div');
        meta.className = 'rhythm-meta';
        meta.textContent = `${row.interval}f loop - ${rhythmMeta(row)}`;
        item.appendChild(meta);
        return item;
      }

      function applyEncounterBaseline(encounter) {
        const config = currentConfig();
        if (encounter.suggestedLevel) {
          config.level = String(encounter.suggestedLevel);
        }
        if (encounter.suggestedPreset !== undefined) {
          config.preset = encounter.suggestedPreset || 'none';
        }
        setConfig(config);
      }

      function renderEncounterInfo() {
        const info = $('encounterInfo');
        const encounter = selectedEncounter();
        info.innerHTML = '';
        if (!encounter || !encounter.id) {
          info.hidden = true;
          return;
        }
        info.hidden = false;
        const title = document.createElement('strong');
        const phase = encounter.phase ? ` - ${encounter.phase}` : '';
        title.textContent = `${encounter.kind || 'encounter'}${phase}`;
        const body = document.createElement('div');
        body.textContent = encounter.description || encounter.label || encounter.id;
        info.appendChild(title);
        info.appendChild(body);
        const intensity = selectedIntensity();
        const pressure = document.createElement('div');
        pressure.textContent = `Pressure: ${intensity.label || intensity.id || 'Standard'} - ${Number(intensity.tempo || 1).toFixed(2)}x tempo, ${Number(intensity.damage || 1).toFixed(2)}x damage`;
        info.appendChild(pressure);
        if (encounter.suggestedLevel || encounter.suggestedPreset) {
          const baseline = document.createElement('div');
          const parts = [];
          if (encounter.suggestedLevel) {
            parts.push(`L${encounter.suggestedLevel}`);
          }
          if (encounter.suggestedPreset) {
            parts.push(`${encounter.suggestedPreset} loadout`);
          }
          baseline.textContent = `Model baseline: ${parts.join(', ')}`;
          info.appendChild(baseline);

          const actions = document.createElement('div');
          actions.className = 'encounter-actions';
          const apply = document.createElement('button');
          apply.type = 'button';
          apply.className = 'secondary compact-action';
          apply.textContent = 'Apply baseline';
          apply.addEventListener('click', () => applyEncounterBaseline(encounter));
          actions.appendChild(apply);
          info.appendChild(actions);
        }
        const features = encounter.features || [];
        if (features.length) {
          const tags = document.createElement('div');
          tags.className = 'tag-list';
          features.forEach((feature) => {
            const tag = document.createElement('span');
            tag.textContent = feature;
            tags.appendChild(tag);
          });
          info.appendChild(tags);
        }
        const rhythms = resolvedRun && resolvedRun.encounter && resolvedRun.encounter.id === encounter.id
          ? (resolvedRun.rhythms || [])
          : encounterRhythms(encounter);
        if (rhythms.length) {
          const rhythmList = document.createElement('div');
          rhythmList.className = 'rhythm-list';
          rhythms.forEach((row) => {
            rhythmList.appendChild(renderRhythmTrack(row));
          });
          info.appendChild(rhythmList);
        }
      }

      function argsFor(config) {
        const args = ['engine.StartLanarts', '--class', config.className, '--level', String(config.level), '--loadout_preset', config.preset, '--settings', 'settings.yaml'];
        if (config.customLoadout) {
          args.push('--loadout', config.customLoadout);
        }
        if (config.encounter) {
          args.push('--encounter', config.encounter);
          args.push('--package_intensity', config.intensity || 'standard');
          if (config.packageComponents) {
            args.push('--package_components', config.packageComponents);
          }
        }
        if (config.monsters) {
          args.push('--monsters', config.monsters);
        } else if (!config.encounter && config.mapDesc) {
          args.push('--start_map_desc', config.mapDesc);
          if (config.mapProfile) {
            args.push('--map_profile', config.mapProfile);
          }
        }
        if (config.seed) {
          args.push('--seed', String(config.seed));
        }
        return args;
      }

      function queryFor(config, autorun) {
        const query = new URLSearchParams();
        query.set('class', config.className);
        query.set('level', config.level);
        query.set('loadout', config.preset);
        query.set('seed', config.seed);
        if (config.customLoadout) {
          query.set('items', config.customLoadout);
        }
        if (config.mapDesc) {
          query.set('map', config.mapDesc);
        }
        if (config.mapAlgorithm) {
          query.set('algo', config.mapAlgorithm);
        }
        if (config.mapProfile) {
          query.set('profile', config.mapProfile);
        }
        if (config.encounter) {
          query.set('encounter', config.encounter);
        }
        if (config.intensity && config.intensity !== 'standard') {
          query.set('pressure', config.intensity);
        }
        if (config.packageComponents) {
          query.set('parts', config.packageComponents);
        }
        if (config.monsters) {
          query.set('monsters', config.monsters);
        }
        if (config.enemyGroup) {
          query.set('enemyGroup', config.enemyGroup);
        }
        if (config.enemyPack) {
          query.set('enemyPack', config.enemyPack);
        }
        if (config.goal && config.goal !== 'enemy-balance') {
          query.set('goal', config.goal);
        }
        if (config.botProfile && config.botProfile !== 'human') {
          query.set('bot', config.botProfile);
        }
        if (autorun) {
          query.set('run', '1');
        }
        return `${location.pathname}?${query.toString()}`;
      }

      function configFromQuery() {
        const query = new URLSearchParams(location.search);
        return {
          className: query.get('class') || 'Fighter',
          level: query.get('level') || '1',
          preset: query.get('loadout') || 'none',
          seed: query.get('seed') || '17300',
          customLoadout: query.get('items') || '',
          mapDesc: query.get('map') || '',
          mapAlgorithm: query.get('algo') || '',
          mapProfile: query.get('profile') || '',
          encounter: query.get('encounter') || '',
          intensity: query.get('pressure') || 'standard',
          packageComponents: query.get('parts') || '',
          monsters: query.get('monsters') || '',
          enemyGroup: query.get('enemyGroup') || 'overworld-ambient',
          enemyPack: query.get('enemyPack') || '',
          goal: query.get('goal') || 'enemy-balance',
          botProfile: query.get('bot') || 'human',
          autorun: query.get('run') === '1',
        };
      }

      function previewColor(palette, key, fallback) {
        const value = palette && palette[key];
        if (!value) {
          return fallback;
        }
        return String(value).charAt(0) === '#' ? value : fallback;
      }

      function pathPoints(ctx, points) {
        if (!points || !points.length) {
          return false;
        }
        ctx.beginPath();
        ctx.moveTo(Number(points[0].x || 0), Number(points[0].y || 0));
        points.slice(1).forEach((point) => {
          ctx.lineTo(Number(point.x || 0), Number(point.y || 0));
        });
        return true;
      }

      function previewArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function drawApiPreview(ctx, plan, profile) {
        const width = Number(plan.width || 112);
        const height = Number(plan.height || 72);
        const palette = plan.palette || profile.palette || {};
        const floor = previewColor(palette, 'floor', '#31553c');
        const floor2 = previewColor(palette, 'floor2', '#416447');
        const wall = previewColor(palette, 'wall', '#1d2922');
        const accent = previewColor(palette, 'accent', '#25465a');
        ctx.canvas.width = width;
        ctx.canvas.height = height;
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, width, height);

        previewArray(plan.corridors).forEach((corridor) => {
          ctx.strokeStyle = corridor.color === 'floor' ? floor : floor2;
          ctx.lineWidth = Number(corridor.width || 4);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(Number(corridor.x1 || 0), Number(corridor.y1 || 0));
          ctx.lineTo(Number(corridor.x2 || 0), Number(corridor.y2 || 0));
          ctx.stroke();
        });

        previewArray(plan.rooms).forEach((room) => {
          const x = Number(room.x || 0);
          const y = Number(room.y || 0);
          const rx = Number(room.rx || 8);
          const ry = Number(room.ry || 6);
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(Number(room.rotation || 0));
          ctx.fillStyle = room.fill === 'floor2' ? floor2 : floor;
          if (room.shape === 'rect') {
            ctx.fillRect(-rx, -ry, rx * 2, ry * 2);
          } else {
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });

        previewArray(plan.rivers).forEach((river) => {
          ctx.strokeStyle = river.color === 'floor2' ? floor2 : accent;
          ctx.lineWidth = Number(river.width || 3);
          ctx.lineCap = 'round';
          if (pathPoints(ctx, previewArray(river.points))) {
            ctx.stroke();
          }
        });

        previewArray(plan.props).forEach((prop) => {
          const x = Number(prop.x || 0);
          const y = Number(prop.y || 0);
          ctx.fillStyle = prop.kind === 'vault' ? '#d7c37a' : '#bfc4a2';
          ctx.fillRect(x - 1, y - 1, 3, 3);
        });

        previewArray(plan.enemyPins).forEach((pin) => {
          const x = Number(pin.x || 0);
          const y = Number(pin.y || 0);
          const monster = String(pin.monster || '').toLowerCase();
          ctx.fillStyle = monster.includes('cloud') ? '#b9d7ff'
            : monster.includes('hound') || monster.includes('mamba') ? '#d36a5c'
              : monster.includes('skeleton') ? '#ddd7bc'
                : '#f0b05a';
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#171d22';
          ctx.lineWidth = 0.75;
          ctx.stroke();
        });
      }

      function drawPreview(canvas, profile, seedText) {
        const ctx = canvas.getContext('2d');
        if (profile.previewPlan) {
          drawApiPreview(ctx, profile.previewPlan, profile);
          return;
        }
        const width = 112;
        const height = 72;
        canvas.width = width;
        canvas.height = height;
        const mode = profile.mode || profile.preview_mode || 'world';
        const palette = profile.palette || {};
        const random = rng(hashString(`${seedText}:${profile.key || profile.id}:${mode}`));
        const floor = palette.floor || (mode === 'hell' ? '#6d3130' : mode === 'lair' ? '#514235' : '#31553c');
        const floor2 = palette.floor2 || (mode === 'hell' ? '#8c3e36' : mode === 'world' ? '#3a5f48' : '#416447');
        const wall = palette.wall || (mode === 'hell' ? '#281a1a' : mode === 'lair' ? '#27231f' : '#1d2922');
        const water = palette.accent || (mode === 'overworld' ? '#25465a' : '#253342');
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, width, height);

        const rooms = 6 + Math.floor(random() * 8);
        for (let i = 0; i < rooms; i += 1) {
          const cx = Math.floor(random() * width);
          const cy = Math.floor(random() * height);
          const rx = 9 + Math.floor(random() * 20 * (1 - profile.density));
          const ry = 6 + Math.floor(random() * 15 * (1 - profile.density));
          ctx.fillStyle = random() > 0.45 ? floor : floor2;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = floor2;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let i = 0; i < rooms - 1; i += 1) {
          ctx.beginPath();
          ctx.moveTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.lineTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.stroke();
        }

        if (mode === 'overworld' || mode === 'world') {
          ctx.strokeStyle = water;
          ctx.lineWidth = 3;
          ctx.beginPath();
          let y = Math.floor(random() * height);
          ctx.moveTo(0, y);
          for (let x = 0; x < width; x += 9) {
            y += Math.floor(random() * 11) - 5;
            ctx.lineTo(x, Math.max(8, Math.min(height - 8, y)));
          }
          ctx.stroke();
        }

        for (let i = 0; i < 16; i += 1) {
          ctx.fillStyle = random() > 0.5 ? '#d7c37a' : '#b6675a';
          ctx.fillRect(Math.floor(random() * width), Math.floor(random() * height), 2, 2);
        }
      }

      function drawPreviews(previewResponse) {
        renderEncounterInfo();
        const seed = currentConfig().seed || '1';
        $('previewSeed').textContent = `seed ${seed}`;
        const grid = $('previewGrid');
        grid.innerHTML = '';
        previewResponse = previewResponse
          || callContentApi('lanarts_content_map_generation_json', currentConfig())
          || callContentApi('lanarts_content_map_preview_json', currentConfig());
        const profiles = previewResponse && previewResponse.previews
          ? previewResponse.previews.map(normalizePreviewProfile)
          : mapProfiles;
        profiles.forEach((profile) => {
          const node = document.createElement('article');
          node.className = 'preview';
          const canvas = document.createElement('canvas');
          const label = document.createElement('div');
          label.className = 'preview-label';
          label.innerHTML = `<strong>${profile.label}</strong><span>${profile.mapProfile || profile.key || 'world graph'}</span>`;
          node.appendChild(canvas);
          node.appendChild(label);
          grid.appendChild(node);
          node.addEventListener('click', () => {
            setConfig({
              ...currentConfig(),
              mapDesc: profile.mapDesc || '',
              mapProfile: profile.mapProfile || '',
              mapAlgorithm: profile.mapAlgorithm || mapAlgorithmIdFor(profile.mapDesc || '', profile.mapProfile || ''),
            });
          });
          drawPreview(canvas, profile, seed);
        });
      }

      function appendOutput(text) {
        const output = $('output');
        output.textContent += `${text}\n`;
        output.scrollTop = output.scrollHeight;
      }

      function launch(config) {
        if (!state.runtimeReady) {
          $('status').lastElementChild.textContent = 'Runtime loading';
          appendOutput('runtime is still loading');
          return;
        }
        if (state.started) {
          location.href = queryFor(config, true);
          return;
        }
        const launchResponse = callContentApi('lanarts_content_launch_args_json', config);
        const args = launchResponse && launchResponse.args ? launchResponse.args : argsFor(config);
        state.started = true;
        document.body.classList.add('running');
        $('status').lastElementChild.textContent = `${config.className} L${config.level} running`;
        appendOutput(`launch ${commandText(args)}`);
        Module.callMain(args);
      }

      function packageSummaryText(summary) {
        if (!summary) {
          return '';
        }
        const parts = [];
        if (summary.rhythmIds && summary.rhythmIds.length) {
          parts.push(summary.rhythmIds.join('/'));
        }
        if (summary.fastestLoopFrames) {
          parts.push(`${summary.fastestLoopFrames}f loop`);
        }
        if (summary.hasRescue) {
          parts.push(`rescue ${summary.rescueClutchWindow || '?'}f`);
        }
        if (summary.hasSummons) {
          parts.push(`adds cap ${summary.summonCap || '?'}`);
        }
        if (summary.hitsEscorts) {
          parts.push('ally risk');
        }
        return parts.join(' | ');
      }

      function mapSummaryText(resource) {
        if (!resource || !resource.previewMode) {
          return '';
        }
        const parts = [resource.previewMode];
        if (resource.mapProfile) {
          parts.push(resource.mapProfile);
        }
        if (resource.density !== null && !Number.isNaN(resource.density)) {
          parts.push(`${Math.round(resource.density * 100)}% density`);
        }
        if (resource.signature && resource.signature.enemyMix) {
          parts.push(resource.signature.enemyMix);
        } else if (resource.signature && resource.signature.ambientEnemies) {
          parts.push(`${resource.signature.ambientEnemies} ambient`);
        }
        return parts.join(' | ');
      }

      function wireResourceList(list, entries) {
        list.innerHTML = '';
        let currentGroup = '';
        entries.forEach((resource) => {
          const group = resource.group || 'Curated';
          if (group !== currentGroup) {
            currentGroup = group;
            const groupNode = document.createElement('div');
            groupNode.className = 'resource-group';
            groupNode.textContent = group;
            list.appendChild(groupNode);
          }
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'resource';
          const goal = resource.goal ? `<span>${resource.goal}</span>` : '';
          const pressure = resource.intensity && resource.intensity !== 'standard' ? ` ${resource.intensity}` : '';
          const parts = resource.packageComponents ? ` ${resource.packageComponents}` : '';
          const skill = resource.botProfile && resource.botProfile !== 'human' ? ` ${resource.botProfile}` : '';
          const summary = packageSummaryText(resource.packageSummary);
          const mapSummary = mapSummaryText(resource);
          const summaryNode = summary ? `<span>${summary}</span>` : '';
          const mapSummaryNode = mapSummary ? `<span>${mapSummary}</span>` : '';
          button.innerHTML = `<span><strong>${resource.name}</strong><span>${resource.meta}</span>${summaryNode}${mapSummaryNode}${goal}</span><code>${resource.className} L${resource.level}${pressure}${parts}${skill}</code>`;
          button.addEventListener('click', () => {
            setConfig(resource);
          });
          list.appendChild(button);
        });
      }

      function wireResources() {
        wireResourceList($('resources'), resources.concat(generatedResources));
      }

      function wireMapResources() {
        wireResourceList($('mapResources'), mapResources);
      }

      function wirePackageResources() {
        wireResourceList($('packageResources'), packageResources);
      }

      function initShell() {
        wireResources();
        wireMapResources();
        wirePackageResources();
        setConfig(configFromQuery());
        document.querySelectorAll('#loadoutPreset button').forEach((button) => {
          button.addEventListener('click', () => {
            setPreset(button.dataset.value);
            refreshLab();
          });
        });
        ['className', 'level', 'seed', 'customLoadout', 'mapAlgorithm', 'encounter', 'intensity', 'packageComponents', 'customMonsters', 'enemyGroup', 'analysisGoal', 'botProfile'].forEach((id) => {
          $(id).addEventListener('input', refreshLab);
          $(id).addEventListener('change', refreshLab);
        });
        $('enemyPack').addEventListener('change', () => {
          const pack = enemyPacks.find((entry) => (entry.id || '') === ($('enemyPack').value || ''));
          if (pack && (pack.monsters || []).length) {
            $('customMonsters').value = pack.monsters.join(', ');
            $('encounter').value = '';
          }
          refreshLab();
        });
        $('mapDesc').addEventListener('change', () => {
          rebuildMapAlgorithms($('mapDesc').value, '');
          refreshLab();
        });
        $('launch').disabled = true;
        $('launch').addEventListener('click', () => launch(currentConfig()));
        $('reseed').addEventListener('click', () => {
          $('seed').value = String(Math.floor(10000 + Math.random() * 900000));
          refreshLab();
        });
        $('copyLink').addEventListener('click', async () => {
          const url = `${location.origin}${queryFor(currentConfig(), false)}`;
          try {
            await navigator.clipboard.writeText(url);
            $('status').lastElementChild.textContent = 'Link copied';
          } catch (err) {
            appendOutput(url);
          }
        });
      }

      function runtimeReady() {
        const queryConfig = configFromQuery();
        state.runtimeReady = true;
        $('launch').disabled = false;
        $('status').lastElementChild.textContent = 'Runtime ready';
        applyCatalog(callContentApi('lanarts_content_catalog_json'));
        setConfig(queryConfig);
        if (queryConfig.autorun) {
          setTimeout(() => launch(currentConfig()), 0);
        }
      }

      return {initShell, runtimeReady, appendOutput};
    })();

    var Module = {
      noInitialRun: true,
      canvas: document.getElementById('canvas'),
      print: function(text) {
        contentLab.appendOutput(text);
      },
      printErr: function(text) {
        contentLab.appendOutput(text);
      },
      preRun: [function() {
        if (typeof ENV !== 'undefined') {
          ENV.LANARTS_MUTE_AUDIO = '1';
          ENV.LANARTS_ENABLE_AUDIO = '0';
          ENV.SDL_AUDIODRIVER = 'dummy';
        }
      }],
      setStatus: function(text) {
        if (text) {
          document.getElementById('status').lastElementChild.textContent = text;
        }
      },
      onAbort: function(reason) {
        document.getElementById('status').lastElementChild.textContent = 'Runtime aborted';
        contentLab.appendOutput(reason || 'abort');
      },
      onRuntimeInitialized: function() {
        contentLab.runtimeReady();
      },
    };

    contentLab.initShell();
  </script>
  {{{ SCRIPT }}}
