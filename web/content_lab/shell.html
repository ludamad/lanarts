      function previewColor(palette, key, fallback) {
        const value = palette && palette[key];
        if (!value) {
          return fallback;
        }
        return String(value).charAt(0) === '#' ? value : fallback;
      }

      function pathPoints(ctx, points) {
        if (!points || !points.length) {
          return false;
        }
        ctx.beginPath();
        ctx.moveTo(Number(points[0].x || 0), Number(points[0].y || 0));
        points.slice(1).forEach((point) => {
          ctx.lineTo(Number(point.x || 0), Number(point.y || 0));
        });
        return true;
      }

      function previewArray(value) {
        return Array.isArray(value) ? value : [];
      }

      function drawApiPreview(ctx, plan, profile) {
        const width = Number(plan.width || 112);
        const height = Number(plan.height || 72);
        const palette = plan.palette || profile.palette || {};
        const floor = previewColor(palette, 'floor', '#31553c');
        const floor2 = previewColor(palette, 'floor2', '#416447');
        const wall = previewColor(palette, 'wall', '#1d2922');
        const accent = previewColor(palette, 'accent', '#25465a');
        ctx.canvas.width = width;
        ctx.canvas.height = height;
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, width, height);

        previewArray(plan.corridors).forEach((corridor) => {
          ctx.strokeStyle = corridor.color === 'floor' ? floor : floor2;
          ctx.lineWidth = Number(corridor.width || 4);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(Number(corridor.x1 || 0), Number(corridor.y1 || 0));
          ctx.lineTo(Number(corridor.x2 || 0), Number(corridor.y2 || 0));
          ctx.stroke();
        });

        previewArray(plan.rooms).forEach((room) => {
          const x = Number(room.x || 0);
          const y = Number(room.y || 0);
          const rx = Number(room.rx || 8);
          const ry = Number(room.ry || 6);
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(Number(room.rotation || 0));
          ctx.fillStyle = room.fill === 'floor2' ? floor2 : floor;
          if (room.shape === 'rect') {
            ctx.fillRect(-rx, -ry, rx * 2, ry * 2);
          } else {
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });

        previewArray(plan.rivers).forEach((river) => {
          ctx.strokeStyle = river.color === 'floor2' ? floor2 : accent;
          ctx.lineWidth = Number(river.width || 3);
          ctx.lineCap = 'round';
          if (pathPoints(ctx, previewArray(river.points))) {
            ctx.stroke();
          }
        });

        previewArray(plan.props).forEach((prop) => {
          const x = Number(prop.x || 0);
          const y = Number(prop.y || 0);
          ctx.fillStyle = prop.kind === 'vault' ? '#d7c37a' : '#bfc4a2';
          ctx.fillRect(x - 1, y - 1, 3, 3);
        });

        previewArray(plan.enemyPins).forEach((pin) => {
          const x = Number(pin.x || 0);
          const y = Number(pin.y || 0);
          const monster = String(pin.monster || '').toLowerCase();
          ctx.fillStyle = monster.includes('cloud') ? '#b9d7ff'
            : monster.includes('hound') || monster.includes('mamba') ? '#d36a5c'
              : monster.includes('skeleton') ? '#ddd7bc'
                : '#f0b05a';
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#171d22';
          ctx.lineWidth = 0.75;
          ctx.stroke();
        });
      }

      function drawPreview(canvas, profile, seedText) {
        const ctx = canvas.getContext('2d');
        if (profile.previewPlan) {
          drawApiPreview(ctx, profile.previewPlan, profile);
          return;
        }
        const width = 112;
        const height = 72;
        canvas.width = width;
        canvas.height = height;
        const mode = profile.mode || profile.preview_mode || 'world';
        const palette = profile.palette || {};
        const random = rng(hashString(`${seedText}:${profile.key || profile.id}:${mode}`));
        const floor = palette.floor || (mode === 'hell' ? '#6d3130' : mode === 'lair' ? '#514235' : '#31553c');
        const floor2 = palette.floor2 || (mode === 'hell' ? '#8c3e36' : mode === 'world' ? '#3a5f48' : '#416447');
        const wall = palette.wall || (mode === 'hell' ? '#281a1a' : mode === 'lair' ? '#27231f' : '#1d2922');
        const water = palette.accent || (mode === 'overworld' ? '#25465a' : '#253342');
        ctx.fillStyle = wall;
        ctx.fillRect(0, 0, width, height);

        const rooms = 6 + Math.floor(random() * 8);
        for (let i = 0; i < rooms; i += 1) {
          const cx = Math.floor(random() * width);
          const cy = Math.floor(random() * height);
          const rx = 9 + Math.floor(random() * 20 * (1 - profile.density));
          const ry = 6 + Math.floor(random() * 15 * (1 - profile.density));
          ctx.fillStyle = random() > 0.45 ? floor : floor2;
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = floor2;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        for (let i = 0; i < rooms - 1; i += 1) {
          ctx.beginPath();
          ctx.moveTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.lineTo(Math.floor(random() * width), Math.floor(random() * height));
          ctx.stroke();
        }

        if (mode === 'overworld' || mode === 'world') {
          ctx.strokeStyle = water;
          ctx.lineWidth = 3;
          ctx.beginPath();
          let y = Math.floor(random() * height);
          ctx.moveTo(0, y);
          for (let x = 0; x < width; x += 9) {
            y += Math.floor(random() * 11) - 5;
            ctx.lineTo(x, Math.max(8, Math.min(height - 8, y)));
          }
          ctx.stroke();
        }

        for (let i = 0; i < 16; i += 1) {
          ctx.fillStyle = random() > 0.5 ? '#d7c37a' : '#b6675a';
          ctx.fillRect(Math.floor(random() * width), Math.floor(random() * height), 2, 2);
        }
      }

      function drawPreviews(previewResponse) {
        renderEncounterInfo();
        const seed = currentConfig().seed || '1';
        $('previewSeed').textContent = `seed ${seed}`;
        const grid = $('previewGrid');
        grid.innerHTML = '';
        previewResponse = previewResponse
          || callContentApi('lanarts_content_map_generation_json', currentConfig())
          || callContentApi('lanarts_content_map_preview_json', currentConfig());
        const profiles = previewResponse && previewResponse.previews
          ? previewResponse.previews.map(normalizePreviewProfile)
          : mapProfiles;
        profiles.forEach((profile) => {
          const node = document.createElement('article');
          node.className = 'preview';
          const canvas = document.createElement('canvas');
          const label = document.createElement('div');
          label.className = 'preview-label';
          const threat = profile.threatProfile || (profile.previewPlan && profile.previewPlan.threatProfile);
          const threatLine = threat ? mapThreatText(threat) : `${Math.round((profile.density || 0) * 100)}% density`;
          label.innerHTML = `<strong>${profile.label}</strong><span>${profile.mapProfile || profile.key || 'world graph'}</span><span>${threatLine}</span>`;
          node.appendChild(canvas);
          node.appendChild(label);
          grid.appendChild(node);
          node.addEventListener('click', () => {
            setConfig({
              ...currentConfig(),
              mapDesc: profile.mapDesc || '',
              mapProfile: profile.mapProfile || '',
              mapAlgorithm: profile.mapAlgorithm || mapAlgorithmIdFor(profile.mapDesc || '', profile.mapProfile || ''),
            });
          });
          drawPreview(canvas, profile, seed);
        });
      }

      function appendOutput(text) {
        const output = $('output');
        output.textContent += `${text}\n`;
        output.scrollTop = output.scrollHeight;
      }

      function launch(config) {
        if (!state.runtimeReady) {
          $('status').lastElementChild.textContent = 'Runtime loading';
          appendOutput('runtime is still loading');
          return;
        }
        if (state.started) {
          location.href = queryFor(config, true);
          return;
        }
        const launchResponse = callContentApi('lanarts_content_launch_args_json', config);
        const args = launchResponse && launchResponse.args ? launchResponse.args : argsFor(config);
        state.started = true;
        document.body.classList.add('running');
        $('status').lastElementChild.textContent = `${config.className} L${config.level} running`;
        appendOutput(`launch ${commandText(args)}`);
        Module.callMain(args);
      }

      function packageSummaryText(summary) {
        if (!summary) {
          return '';
        }
        const parts = [];
        if (summary.rhythmIds && summary.rhythmIds.length) {
          parts.push(summary.rhythmIds.join('/'));
        }
        if (summary.fastestLoopFrames) {
          parts.push(`${summary.fastestLoopFrames}f loop`);
        }
        if (summary.hasRescue) {
          parts.push(`rescue ${summary.rescueClutchWindow || '?'}f`);
        }
        if (summary.hasSummons) {
          parts.push(`adds cap ${summary.summonCap || '?'}`);
        }
        if (summary.hitsEscorts) {
          parts.push('ally risk');
        }
        return parts.join(' | ');
      }

      function microDrillSummaryText(drill) {
        if (!drill) {
          return '';
        }
        const parts = [];
        if (drill.role) {
          parts.push(drill.role);
        }
        (drill.tags || []).slice(0, 3).forEach((tag) => parts.push(tag));
        return parts.join(' | ');
      }

      function scorecardSummaryText(scorecard) {
        if (!scorecard) {
          return '';
        }
        const rows = scorecard.rows || [];
        const parts = [];
        rows.slice(0, 3).forEach((row) => {
          parts.push(`${row.label || row.metric}${row.target ? ` ${row.target}` : ''}`);
        });
        return parts.join(' | ');
      }

      function mapSummaryText(resource) {
        if (!resource || !resource.previewMode) {
          return '';
        }
        const parts = [resource.previewMode];
        if (resource.mapProfile) {
          parts.push(resource.mapProfile);
        }
        if (resource.density !== null && !Number.isNaN(resource.density)) {
          parts.push(`${Math.round(resource.density * 100)}% density`);
        }
        if (resource.signature && resource.signature.enemyMix) {
          parts.push(resource.signature.enemyMix);
        } else if (resource.signature && resource.signature.ambientEnemies) {
          parts.push(`${resource.signature.ambientEnemies} ambient`);
        }
        if (resource.mapThreat) {
          parts.push(mapThreatText(resource.mapThreat));
        }
        return parts.join(' | ');
      }

      function matchupSummaryText(matchup) {
        if (!matchup) {
          return '';
        }
        const parts = [];
        if (matchup.label) {
          parts.push(matchup.label);
        }
        if (matchup.severity && matchup.severity !== 'neutral') {
          parts.push(matchup.severity);
        }
        const risks = asList(matchup.risks);
        const strengths = asList(matchup.strengths);
        const risk = risks.length ? risks[0] : '';
        const strength = strengths.length ? strengths[0] : '';
        if (risk) {
          parts.push(risk);
        } else if (strength) {
          parts.push(strength);
        }
        return parts.join(' | ');
      }

      function readinessSummaryText(readiness) {
        if (!readiness) {
          return '';
        }
        const parts = [];
        if (readiness.label) {
          parts.push(`${readiness.label}${readiness.score === undefined ? '' : ` ${readiness.score}`}`);
        }
        const strengths = asList(readiness.strengths);
        const gaps = asList(readiness.gaps);
        const strength = strengths.length ? strengths[0] : '';
        const gap = gaps.length ? gaps[0] : '';
        if (strength) {
          parts.push(strength);
        }
        if (gap) {
          parts.push(gap);
        }
        return parts.join(' | ');
      }

      function mapThreatText(threat) {
        if (!threat) {
          return '';
        }
        const parts = [`${threat.label || 'threat'} ${threat.score || 0}`];
        if (threat.enemyCount !== undefined) {
          parts.push(`${threat.enemyCount} enemies`);
        }
        if (threat.clusteredPairs) {
          parts.push(`${threat.clusteredPairs} clusters`);
        }
        if (threat.casterCount || threat.rangedCount) {
          parts.push(`${threat.casterCount || threat.rangedCount} caster`);
        }
        if (threat.predatorCount) {
          parts.push(`${threat.predatorCount} predator`);
        }
        return parts.join(' ');
      }

      function wireResourceList(list, entries) {
        list.innerHTML = '';
        let currentGroup = '';
        entries.forEach((resource) => {
          const group = resource.group || 'Curated';
          if (group !== currentGroup) {
            currentGroup = group;
            const groupNode = document.createElement('div');
            groupNode.className = 'resource-group';
            groupNode.textContent = group;
            list.appendChild(groupNode);
          }
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'resource';
          const goal = resource.goal ? `<span>${resource.goal}</span>` : '';
          const pressure = resource.intensity && resource.intensity !== 'standard' ? ` ${resource.intensity}` : '';
          const parts = resource.packageComponents ? ` ${resource.packageComponents}` : '';
          const skill = resource.botProfile && resource.botProfile !== 'human' ? ` ${resource.botProfile}` : '';
          const summary = packageSummaryText(resource.packageSummary);
          const drillSummary = microDrillSummaryText(resource.microDrill);
          const scorecardSummary = scorecardSummaryText(resource.scorecard);
          const mapSummary = mapSummaryText(resource);
          const matchupSummary = matchupSummaryText(resource.matchup);
          const readinessSummary = readinessSummaryText(resource.loadoutReadiness);
          const summaryNode = summary ? `<span>${summary}</span>` : '';
          const drillSummaryNode = drillSummary ? `<span>${drillSummary}</span>` : '';
          const scorecardNode = scorecardSummary ? `<span>${scorecardSummary}</span>` : '';
          const mapSummaryNode = mapSummary ? `<span>${mapSummary}</span>` : '';
          const matchupNode = matchupSummary ? `<span>${matchupSummary}</span>` : '';
          const readinessNode = readinessSummary ? `<span>${readinessSummary}</span>` : '';
          button.innerHTML = `<span><strong>${resource.name}</strong><span>${resource.meta}</span>${summaryNode}${drillSummaryNode}${scorecardNode}${mapSummaryNode}${matchupNode}${readinessNode}${goal}</span><code>${resource.className} L${resource.level}${pressure}${parts}${skill}</code>`;
          button.addEventListener('click', () => {
            setConfig(resource);
          });
          list.appendChild(button);
        });
      }

      function wireResources() {
        wireResourceList($('resources'), resources.concat(generatedResources));
      }

      function wireMapResources() {
        wireResourceList($('mapResources'), mapResources);
      }

      function wirePackageResources() {
        wireResourceList($('packageResources'), packageResources);
      }

      function initShell() {
        wireResources();
        wireMapResources();
        wirePackageResources();
        setConfig(configFromQuery());
        document.querySelectorAll('#loadoutPreset button').forEach((button) => {
          button.addEventListener('click', () => {
            setPreset(button.dataset.value);
            refreshLab();
          });
        });
        ['className', 'level', 'seed', 'customLoadout', 'mapAlgorithm', 'encounter', 'intensity', 'packageComponents', 'customMonsters', 'enemyGroup', 'analysisGoal', 'botProfile'].forEach((id) => {
          $(id).addEventListener('input', refreshLab);
          $(id).addEventListener('change', refreshLab);
        });
        $('enemyPack').addEventListener('change', () => {
          const pack = enemyPacks.find((entry) => (entry.id || '') === ($('enemyPack').value || ''));
          if (pack && (pack.monsters || []).length) {
            $('customMonsters').value = pack.monsters.join(', ');
            $('encounter').value = '';
          }
          refreshLab();
        });
        $('microDrill').addEventListener('change', applyMicroDrillSelection);
        $('mapDesc').addEventListener('change', () => {
          rebuildMapAlgorithms($('mapDesc').value, '');
          refreshLab();
        });
        $('launch').disabled = true;
        $('launch').addEventListener('click', () => launch(currentConfig()));
        $('reseed').addEventListener('click', () => {
          $('seed').value = String(Math.floor(10000 + Math.random() * 900000));
          refreshLab();
        });
        $('copyLink').addEventListener('click', async () => {
          const url = `${location.origin}${queryFor(currentConfig(), false)}`;
          try {
            await navigator.clipboard.writeText(url);
            $('status').lastElementChild.textContent = 'Link copied';
          } catch (err) {
            appendOutput(url);
          }
        });
      }

      function runtimeReady() {
        const queryConfig = configFromQuery();
        state.runtimeReady = true;
        $('launch').disabled = false;
        $('status').lastElementChild.textContent = 'Runtime ready';
        applyCatalog(callContentApi('lanarts_content_catalog_json'));
        setConfig(queryConfig);
        if (queryConfig.drill) {
          applyMicroDrillSelection();
        }
        if (queryConfig.autorun) {
          setTimeout(() => launch(currentConfig()), 0);
        }
      }

      return {initShell, runtimeReady, appendOutput};
    })();

    var Module = {
      noInitialRun: true,
      canvas: document.getElementById('canvas'),
      print: function(text) {
        contentLab.appendOutput(text);
      },
      printErr: function(text) {
        contentLab.appendOutput(text);
      },
      preRun: [function() {
        if (typeof ENV !== 'undefined') {
          ENV.LANARTS_MUTE_AUDIO = '1';
          ENV.LANARTS_ENABLE_AUDIO = '0';
          ENV.SDL_AUDIODRIVER = 'dummy';
        }
      }],
      setStatus: function(text) {
        if (text) {
          document.getElementById('status').lastElementChild.textContent = text;
        }
      },
      onAbort: function(reason) {
        document.getElementById('status').lastElementChild.textContent = 'Runtime aborted';
        contentLab.appendOutput(reason || 'abort');
      },
      onRuntimeInitialized: function() {
        contentLab.runtimeReady();
      },
    };

    contentLab.initShell();
  </script>
  {{{ SCRIPT }}}
